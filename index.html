  </main>
</div>

<div id="detail"></div>
<div id="toast" class="banner toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  var C = window.AR_CONFIG;
  var V = window.ArView;
  var VIEW_VERSION = '2026-10-03.dunning.1';   // <script src="ar-view.js?v=…"> と ar-view.js の VERSION と同じ値にする（静的な試験で照らす）
  var MOCK = new URLSearchParams(location.search).get('mock') === '1';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var has = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };

  // ---- 状態 ----
  // ★ 書き込み（保存・移動・確定）は同時に1つだけ（S.write）。書き込みは、ほかの通信（背景の読み取りを除く）が
  //   1本も走っていないときにだけ始める（runWrite）。フェーズ1 の案B（計画 §6-15）の「同時に1つ」は保つ。
  //   段C 案B+（計画 ar-app-perf §8-11・§8-13・§8-14）で「その間は画面全体を止める」をやめた。止めるのは、
  //   書き込み中の請求・次の書き込み・一覧の取り直し・サインアウトだけ。応答は、その操作の請求と控えにだけ当てる
  var S = {
    token: null, user: null,
    screen: 'signin',     // signin / config / loading / error / denied / main
    screenMessage: '', deniedSub: '',
    tabs: null, fetchedAt: '', warnings: [], listBusy: false,
    // 成果表示（ar-app-outcome §3-3）: 今表示している一覧の札（snapId）、outcome の応答（その札のものだけ）、「入金で解消」を開いているか
    snapId: null, outcome: null, paidOpen: false,
    tab: '未入金', days: 1, query: '', sort: 'age',
    openId: null, openPartner: '', detailGen: 0,
    detail: null,         // { loading, records, error }
    draftStatus: null, draftMemo: null,
    draftAssignee: null,  // 詳細で選んだ担当（メール、未割り当ては ''）。保存するまで送らない（ar-app-assignee §2-2）
    staff: [],            // 利用者シートの営業（サーバの staff）。features が無いサーバ（旧サーバ）では使わない
    features: null,       // サーバが担当に対応しているか（{ assignee: 1 }）。無ければ担当の表示・操作を出さない（第1巡 指摘2）
    staffSel: '全社',     // 右上の「担当」の選択（全社／営業のメール／未割り当て）
    notice: null,         // { kind: saved|info|conflict|paid|unknown|error, text, done }。★ 保存されなかったメモは知らせに持たせない（下の lost・unsettled が正本。W5 第4巡 指摘2）
    // 書き込み中の1件: { opId, id（請求ID）, partnerId, partner, kind: save|drag|settle, wish（希望の全項目）, gen（サインインの世代）, owner }。
    // 応答・後始末は、S.write がその操作のままで、世代が一致するときだけ当てる（§8-13-1 の2・§8-14-2 の I1）
    write: null,
    // 段D（計画 ar-app-perf §9）: ドラッグの保存待ち。送る前の移動（請求ID → V.moveAdd の項目）と、送り出しの実行者の状態。
    // moveState: empty（無い）／waiting（3秒を数えている）／active（送り出している。書き込みの枠が空くのを待つ間も含む）／stopped（止まった）。
    // moveOp は今送っている1件（S.write と同じもの）。送り出しの実行者は1つだけで、合図（kickMoves）は moveOp がある間は何もしない（§9-9-2）
    moves: {}, moveSeq: 0, moveState: 'empty', moveTimer: null, moveOp: null, moveStopWhy: '', moveTally: { saved: 0, failed: 0, unknown: 0 },
    moveInflight: 0,      // 移動の送り出しの通信（update・確定）の数。詳細の readyMs はこの待ちを含めない（§9-11）
    composing: false, refreshPending: false,   // 入力の変換中は描き直しを待つ（段C C2 R2）
    unsettled: {},        // 応答が分からなかった保存・移動: 請求ID → { opId, kind: save|drag, lostMemo, partner, partnerId, assignee, to, wish }。確定するまでその請求を操作させない
    lost: {},             // 保存されなかったメモの控え: 請求ID → { partner, items: [{ text, memo }] }。請求ごとに複数件（続けて失敗しても上書きしない）。
                          // 1件ずつ「消す」か、同じ内容の保存が成功するまで残す。一覧から消えても「要確認」から取り出せる（ar-view.js の addLost など）
    inflight: 0,
    // 背景の読み取り（開いている詳細の記録の読み込み）の数。これだけは保存の開始を妨げない（計画 ar-app-perf §3-2 K2）
    bgInflight: 0,
    // サインインの世代。サインイン・サインアウト・サインイン切れ・拒否のたびに進める。
    // 前の世代で始めた読み込みの応答は、画面へ反映しない（W6 後の確認 第1巡 指摘2）
    authGen: 0, listGen: -1,
    // 控え（lost・unsettled）の持ち主。別の人がサインインしたら、前の人の控えはしまっておき、同じ人が戻れば出す（同 指摘3）
    ownerKey: null, stashes: {},
    // 持ち主（ownerKey）を決めたサインインの世代。今の世代と同じときだけ、計測の行をその持ち主のものとして扱う
    // （A2 第1巡 指摘1: 切り替えの途中に届いた前の人の応答・起動に失敗した人の行を、別の持ち主へ入れない）
    ownerGen: -1
  };
  // ドラッグはマウス・トラックパッドなど「細かく指し示せる道具」が1つでもあれば有効（タッチパネル付きのパソコンを含む）。
  // スマートフォン（指だけ）は無効のまま（計画 §3-5・G10）。指でなぞるドラッグには対応しない
  // （W6 でタッチパネル付きのノートPCでドラッグできなかった報告を受けて変更。2026-09-26 ユーザー判断＝案A）
  var canDrag = window.matchMedia('(any-pointer: fine)').matches;
  function locked(id) { return has(S.unsettled, id); }

  // 操作ID（保存・移動のたびに作る。サーバが記録行に残し、「確定して」で照らし合わせる）
  function newOpId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16);
    crypto.getRandomValues(b);
    return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  }

  // ---- 通信（計画 §3-5。URLSearchParams の payload でプリフライトを起こさない） ----
  // 画面下の「応答を待っています」の帯は出さない（段D §9-4。読み込みの情報をメッセージで出さない）
  var idleWaiters = [];
  function beginWait() {
    S.inflight++;
    syncSaveButton();
  }
  function endWait() {
    S.inflight = Math.max(0, S.inflight - 1);
    if (fgInflight() === 0 && idleWaiters.length) { var w = idleWaiters; idleWaiters = []; w.forEach(function (f) { f(); }); }
    checkReady();
  }
  // 前景の通信（背景の読み取りを除く）がすべて戻るまで待つ。新しい世代の起動は、前の世代の書き込みの通信が戻ってから（§9-10-1 の5）
  function untilNoForeground() { return fgInflight() === 0 ? Promise.resolve() : new Promise(function (res) { idleWaiters.push(res); }); }
  // opts: ctx（計測の場面。あれば要求ID を付けて行を残す）・retry（取り直しの番号）・bg（背景の読み取り。K2）・
  //       keepalive（書き込み。ページを閉じても送り切る指定。段C §8-11-2 の8）
  async function api(action, extra, opts) {
    opts = opts || {};
    var rid = opts.ctx ? newOpId() : '';
    var payload = Object.assign({ action: action, idToken: S.token }, extra || {});
    if (rid) payload.rid = rid;
    var t0 = performance.now();
    var r = null;
    if (opts.bg) S.bgInflight++;       // 背景の読み取りを、一瞬でも前景として数えない（保存ボタンの待ちの表示。段C C2 R1）
    if (opts.move) S.moveInflight++;   // 移動の送り出しの通信（詳細の readyMs はこれを待たない。§9-11）
    beginWait();
    try {
      r = await send(payload, !!opts.keepalive);
      return r;
    } finally {
      if (opts.bg) S.bgInflight = Math.max(0, S.bgInflight - 1);
      if (opts.move) S.moveInflight = Math.max(0, S.moveInflight - 1);
      endWait();
      if (opts.ctx) perfReq(opts.ctx, action, opts.retry || 0, rid, t0, r);
    }
  }
  async function send(payload, keepalive) {
    if (MOCK) return V.classifyResponse(await window.AR_MOCK_API(payload));
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, C.TIMEOUT_MS);
    try {
      var f = V.fetchInit(payload, keepalive);   // 本物の送信の組み立て（node の試験と同じ関数。§8-14-2 の I3）
      f.init.signal = ctrl.signal;
      var res = await fetch(C.GAS_URL, f.init);
      return V.classifyResponse({ text: await res.text() });
    } catch (e) {
      return V.classifyResponse(e && e.name === 'AbortError' ? { aborted: true } : { networkError: true });
    } finally {
      clearTimeout(timer);
    }
  }
  // 書き込みを妨げる通信の数（背景の読み取りを除く）
  function fgInflight() { return S.inflight - S.bgInflight; }

  // 書き込みを始めてよいか。書き込み中・ほかの通信（背景の読み取りを除く）・一覧の取り直しの間は始めない。
  // サインインが切れた後も、前の書き込みの要求が戻るまでは始めない（fgInflight。同時に走る書き込みは常に1本以下）
  function canWrite() { return !S.write && fgInflight() === 0 && !S.listBusy; }
  // 移動の保存待ち・送信中があるか（段D）。ある間は、詳細の保存・更新・サインアウトを始めない（§9-2・§9-3 の8・9）
  function hasMoves() { return Object.keys(S.moves).length > 0; }
  function movesPending() { return hasMoves() || !!S.moveOp; }
  function moveWriting() { return !!(S.write && S.write.kind === 'drag'); }
  // 詳細の保存を始めてよいか（移動を送り切るまで待たせる。§9-1）
  function canSaveNow() { return canWrite() && !movesPending(); }
  // 詳細の readyMs の「押せる」: 移動の保存待ち・送り出しの通信を待つ時間は含めない（§9-11）。そのほかは段C と同じ
  function readyIgnoringMoves(id) {
    var w = S.write && S.write.kind !== 'drag' ? S.write : null;
    return !w && fgInflight() - S.moveInflight === 0 && !S.listBusy && !locked(id);
  }
  // 詳細の「保存ボタンが押せるまで」を追う（段C C2 R1）。押せる＝書き込みを始めてよく、その請求が書き込み中・未確定でない。
  // 押せるようになる前に閉じた詳細は、readyMs を持たない行として残す（押せるまでに至らなかった標本。集計で別に数える。計画 §8-16）
  var readyWatch = null;   // { ctx, id }
  function waitLabel() {
    if (S.moveState === 'stopped' && movesPending()) return '止まっている移動があります';
    if (movesPending()) return '移動の保存を待っています';
    return S.write ? '前の保存を待っています' : '読み込みを待っています';
  }
  // 保存ボタンの「待っています」を、描き直さずに今の状態へ合わせる（一覧の読み込み・通信の終わりで。段C C2 R1）
  function syncSaveButton() {
    var b = document.querySelector('#detail [data-save]');
    if (!b || b.hasAttribute('data-card-busy')) return;
    var wait = !canSaveNow();
    b.disabled = wait;
    b.textContent = wait ? waitLabel() : '変更をまとめて保存';
  }
  // 通信の終わり・描き直しのたびに呼ばれる。移動の送り出しへも「書き込みの枠が空いたかもしれない」と合図する
  // （§9-9-2。送っている間・数えている間・止まった間の合図は、kickMoves が何もしない）
  function checkReady() {
    syncSaveButton();
    kickMoves('idle');
    var w = readyWatch;
    if (!w) return;
    if (S.openId !== w.id) { readyWatch = null; flushDetailPerf(w.ctx); return; }
    if (readyIgnoringMoves(w.id)) {
      w.ctx.readyMs = Math.round(performance.now() - w.ctx.t0);
      readyWatch = null;
      flushDetailPerf(w.ctx);
    }
  }

  function flushDetailPerf(ctx) {
    if (ctx.pendingResult === undefined) return;   // 詳細の応答がまだ（応答のときにもう一度呼ばれる）
    var res = ctx.pendingResult;
    ctx.pendingResult = undefined;
    perfEnd(ctx, res, ctx.readyMs !== undefined ? { readyMs: ctx.readyMs } : {});
  }
  function refuseWrite(kind) {
    toast(movesPending() ? '移動の保存が終わってから、もう一度操作してください。' : S.write ? '前の保存が終わってから、もう一度操作してください。' : '読み込みの途中です。終わってから、もう一度操作してください。', 'error');
    perfRejected(kind || 'save');
  }
  // 書き込みを1つだけ走らせる（段C: 画面は止めない）。kind は断ったときの計測の種類（save・drag・detail）。
  // 後始末（S.write を外す・描き直す）は、S.write がまだこの操作のときだけ（§8-14-2 の I1。切れた後の古い処理が新しい書き込みを外さない）
  async function runWrite(op, fn, kind) {
    if (!canWrite()) { refuseWrite(kind); return false; }
    S.write = op;
    refreshViews();
    try {
      await fn();
    } finally {
      if (S.write === op) { S.write = null; refreshViews(); }
    }
    return true;
  }
  // 描き直す。入力の変換中（IME）は待ち、変換が終わってから描き直す。描き直しの前後で、フォーカス・選択・開閉・詳細の位置を保つ（段C C2 R2）
  function refreshViews() {
    if (S.composing) { S.refreshPending = true; checkReady(); return; }   // 描き直しは待つが、保存ボタンと計測は合わせる
    var ui = captureUI();
    if (S.screen === 'main') renderMain();
    if (S.openId) renderDetail();
    restoreUI(ui);
    checkReady();
  }
  // 操作（保存・移動）を受け付けたときに、希望の全項目と持ち主を写して持つ（§8-13-1 の1）
  function newOp(kind, card, body) {
    return { opId: body.opId, id: card.billingId, partnerId: card.partnerId || '', partner: card.partner, billingNumber: card.billingNumber || '', kind: kind,
      wish: V.wishOf(body), gen: S.authGen, owner: S.ownerKey };
  }
  // 回収の識別子は操作ID、要確認には請求番号も出す（段C C2 R3）
  function opMeta(o) { return { key: o.opId, billingNumber: o.billingNumber || '' }; }
  // 応答が分からない操作を、未確定の控えの形にする（希望の全項目を持たせる）
  function unsettledOf(op) {
    var w = op.wish || {};
    return { opId: op.opId, kind: op.kind === 'drag' ? 'drag' : 'save', partner: op.partner, partnerId: op.partnerId, billingNumber: op.billingNumber || '',
      lostMemo: typeof w.memo === 'string' && w.memo !== '' ? w.memo : null, assignee: w.assignee, to: w.status, wish: w };
  }
  // ---- 段D: ドラッグの保存待ちと送り出し（計画 ar-app-perf §9-3・§9-9・§9-10） ----
  // ドラッグはすぐには送らず保存待ちに入れ、最後のドラッグから3秒（または「今すぐ保存」）で、受け付けた順に1件ずつ送る。
  // 送るのは今の書き込みの入口（runWrite → moveInner）で、書き込みは同時に1件のまま。サーバは変えない
  var MOVE_BATCH_MS = 3000;            // 最後のドラッグから送り出しまで（ユーザーの提案 2026-09-30）
  var moveKickPending = false;
  // 送り出しの実行者への合図。timer（3秒の満了）・now（今すぐ保存）は送り出しを始める。
  // idle（書き込み・通信の終わり）は、送り出している（active）ときだけ次を送る。送っている1件がある間はどの合図も何もしない
  function kickMoves(reason) {
    if (reason === 'idle') {
      if (moveKickPending) return;     // 描き直しのたびに呼ばれるので、まとめて1回にする（同期の入れ子で送り始めない）
      moveKickPending = true;
      setTimeout(function () { moveKickPending = false; runMoves(); }, 0);
      return;
    }
    clearMoveTimer();
    if (hasMoves()) { S.moveState = 'active'; S.moveStopWhy = ''; }
    renderMoveBar();
    runMoves();
  }
  function runMoves() {
    if (S.moveOp) return;
    // 保存待ちが空になった: 1回だけ片付けて、まとめの知らせを出す（空のままの合図では何もしない。描き直しからの合図で繰り返さない）
    if (!hasMoves()) { if (S.moveState !== 'empty') { clearMoveTimer(); S.moveState = 'empty'; finishMoves(); } return; }
    if (S.moveState !== 'active') return;   // 数えている間・止まった間は送らない
    if (!canWrite()) return;                // 書き込みの枠が空いたら、idle の合図でもう一度来る
    sendNextMove();
  }
  function clearMoveTimer() { if (S.moveTimer) { clearTimeout(S.moveTimer); S.moveTimer = null; } }
  // ドラッグを受け付けたら3秒を数え直す。保存待ちが空になったら（元へ戻した）数えるのをやめる
  function restartMoveTimer() {
    clearMoveTimer();
    if (hasMoves()) {
      S.moveState = 'waiting';
      var g = S.authGen;
      S.moveTimer = setTimeout(function () { S.moveTimer = null; if (g === S.authGen) kickMoves('timer'); }, MOVE_BATCH_MS);
    } else if (S.moveOp) {
      S.moveState = 'active';                // 送っている1件が終わったら、まとめの知らせを出す
    } else {
      S.moveState = 'empty';
      finishMoves();
    }
  }
  // 1件を送る。保存待ちの先頭を、送る直前に同期の処理の中で外し、操作ID を作って送信中の1件に結び付ける（§9-9-2）。
  // 以後その希望は保存待ちに戻らない（止まった後の再開で、同じ希望を新しい操作ID で送り直さない）
  async function sendNextMove() {
    var e = V.moveTake(S.moves);
    if (!e) return;
    var card = findCard(e.id);
    if (e.owner !== S.ownerKey || e.gen !== S.authGen || !card) {
      // 持ち主・世代が今と違う（世代の切り替えで片付けるので、ふつうは起きない。§9-9-1）・一覧に無い: 送らずに要確認へ
      parkMoveEntry(e, card ? 'サインインが切り替わったため移していません' : 'この請求は一覧にありませんでした。移していません');
      if (e.gen === S.authGen) S.moveTally.failed++;
      kickMoves('idle');
      return;
    }
    var body = { billingId: e.id, status: e.to, baseRecordId: e.base, opId: newOpId() };
    var op = newOp('drag', card, body);
    var res = { o: 'discard' };
    S.moveOp = op;
    var started = await runWrite(op, async function () { res = await moveInner(op, body, e.ctx || perfScene('drag')); }, 'drag');
    if (S.moveOp === op) S.moveOp = null;
    if (!started) {                      // 書き込みの枠を取れなかった（runMoves が確かめているので、ふつうは起きない）: 保存待ちへ戻す
      if (op.gen === S.authGen && !has(S.moves, e.id)) S.moves[e.id] = e;
      return;
    }
    if (op.gen !== S.authGen || res.o === 'discard' || res.o === 'auth') return;   // 世代が変わった: 片付けは世代の切り替えが済ませた
    if (res.o === 'stop') { stopMoves(res.why); return; }
    kickMoves('idle');
  }
  // 送り出しを止める。残りは保存待ちのまま（印も残す）。再開は「今すぐ保存」か、新しいドラッグの3秒（§9-3 の6・§9-9-2）
  function stopMoves(why) {
    if (!hasMoves()) { S.moveState = 'empty'; finishMoves(); return; }
    S.moveState = 'stopped';
    S.moveStopWhy = why || '';
    var t = S.moveTally;
    toast('移動の保存を止めました（' + S.moveStopWhy + '）。「今すぐ保存」で続きを送ります。' +
      (t.failed + t.unknown ? '保存できなかった・確かめられなかった移動は「要確認」を見てください。' : ''), 'error');
    refreshViews();
  }
  // 送り出しが終わったら、まとめの知らせを1回だけ出す（1件ごとには出さない。§9-3 の10・§9-4）
  function finishMoves() {
    var t = S.moveTally;
    S.moveTally = { saved: 0, failed: 0, unknown: 0 };
    S.moveStopWhy = '';
    var m = V.moveSummary(t.saved, t.failed, t.unknown);
    if (m) toast(m.text, m.kind);
    refreshViews();                      // 詳細の保存ボタン・「更新」・カードの印を、送り終えた状態へ描き直す
  }
  // 保存待ちの1件を、その持ち主の要確認へ（送っていないので書かれていないと決まっている）
  function parkMoveEntry(e, text) {
    var box = e.owner === S.ownerKey ? S.lost : (S.stashes[e.owner] || (S.stashes[e.owner] = { lost: {}, unsettled: {} })).lost;
    V.addWish(box, e.id, e.partner, text, { status: e.to }, { key: 'move:' + e.gen + ':' + e.seq, billingNumber: e.billingNumber });
  }
  // 世代を切り替える前に、保存待ちの全件をその持ち主の要確認へ移し、送り出しを空にする（§9-9-1・§9-10-1）
  function parkMoves() {
    Object.keys(S.moves).forEach(function (k) { parkMoveEntry(S.moves[k], 'サインインが切り替わったため移していません'); });
    S.moves = {};
    clearMoveTimer();
    S.moveState = 'empty'; S.moveOp = null; S.moveStopWhy = '';
    S.moveTally = { saved: 0, failed: 0, unknown: 0 };
  }
  // 画面の上の「保存待ち n件」と「今すぐ保存」
  function renderMoveBar() {
    var el = document.getElementById('move-bar');
    if (!el) return;
    var n = Object.keys(S.moves).length + (S.moveOp ? 1 : 0);
    el.innerHTML = !n ? '' : '保存待ち ' + n + '件' + (S.moveState === 'stopped' ? '（止まっています）' : '') +
      (hasMoves() ? ' <button type="button" class="button small primary" data-move-now>今すぐ保存</button>' : '');
  }

  // サインインが切れた・拒否された瞬間に、書き込み中の1件を持ち主の未確定にする。その操作の遅れて届いた応答は捨てる（§8-13-1 の2）
  function parkWrite() {
    var w = S.write;
    if (!w) return;
    S.write = null;
    if (w.kind === 'settle') return;   // 確定の問い合わせなら、未確定の控えはもうある
    var box = w.owner === S.ownerKey ? S.unsettled : (S.stashes[w.owner] || (S.stashes[w.owner] = { lost: {}, unsettled: {} })).unsettled;
    if (!has(box, w.id)) box[w.id] = unsettledOf(w);
  }
  // 応答を当ててよいか: 今の書き込みがこの操作のままで、サインインの世代が同じとき
  function stillMine(op) { return S.write === op && op.gen === S.authGen; }

  // どの操作でも共通: サインイン切れ・許可なし は画面ごと切り替える。切り替えたら true
  function handleAuthFailure(r) {
    if (r.kind !== 'fail') return false;
    if (r.code === 'UNAUTHENTICATED' || r.code === 'FORBIDDEN') { parkWrite(); parkMoves(); }   // 画面を切り替える前に（§8-13-1 の2・段D §9-10-1）
    if (r.code === 'UNAUTHENTICATED') {
      S.token = null;
      S.authGen++;
      forgetUser();
      clearShownData();
      showScreen('signin', 'サインインの期限が切れました。もう一度サインインしてください。');
      return true;
    }
    if (r.code === 'FORBIDDEN') {
      S.token = null;
      S.deniedSub = r.json.sub || '';
      S.authGen++;
      forgetUser();
      clearShownData();
      showScreen('denied');
      return true;
    }
    return false;
  }

  // サインイン切れ・拒否のときに、前の利用者の表示を消す。控えの持ち主（ownerKey）は残す（次に起動した人が
  // 同じ人なら控えを戻し、別の人なら applyBoot の useStashOf でしまう）。
  // ★ S.user を残すと、次の人の起動が失敗した後の「再試行」が起動を済んだものと見て、前の人の表示・控えのまま
  //   一覧だけを取り直してしまう（A2 第2巡 指摘1。フェーズ1 の版にもあった経路）
  function forgetUser() {
    S.user = null;
    $('#who').textContent = '';
  }

  // 拒否・サインイン切れのときに、前に読み込んでいた請求の内容を画面から消す（W6 で見つかった不具合。計画 §6-20）。
  // 保存されなかったメモの控え（S.lost）と未確定の操作（S.unsettled）は本人のものなので消さない（サインインし直せば要確認に戻る）。
  // 詳細の書きかけは、消す前に希望の全項目（連絡状況・メモを空にする変更・担当）としてその人の控えへ移す（段C §8-13-1 の3）
  function clearShownData() {
    var id = S.openId;
    var card = id ? findCard(id) : null;
    if (card && !locked(id)) {
      V.addWish(S.lost, id, card.partner, 'サインインが切れた・切り替わった・許可されなかったため保存していません。サインインし直してから、もう一度操作してください',
        V.draftWish(card, S.draftStatus, S.draftMemo, S.features ? S.draftAssignee : null), { key: 'draft:' + newOpId(), billingNumber: card.billingNumber });
    }
    S.openId = null; S.detail = null; S.notice = null; S.draftStatus = null; S.draftMemo = null; S.draftAssignee = null;
    S.detailGen++;
    S.tabs = null; S.fetchedAt = ''; S.warnings = [];
    S.snapId = null; S.outcome = null; S.paidOpen = false; $('#outcome').innerHTML = '';
    $('#detail').innerHTML = '';
    $('#list').innerHTML = '';
    $('#attention').innerHTML = '';
    $('#warnings').innerHTML = '';
    ['#stat-count', '#stat-total', '#stat-untouched', '#count-unpaid', '#count-unset', '#shown-count', '#last-fetch'].forEach(function (sel) { $(sel).textContent = ''; });
    document.body.style.overflow = '';
  }

  // ---- サインイン（Google Identity Services） ----
  // 世代を切り替える前に、前の人の送信中・保存待ち・書きかけを、その人の控えへ移し、前の人の表示を消す（段D §9-10-1 の1〜3）。
  // 新しい世代の起動は、前の世代の書き込みの通信が戻ってから（start）
  function onCredential(resp) {
    parkWrite(); parkMoves();
    if (S.tabs || S.openId) { forgetUser(); clearShownData(); }
    S.token = resp.credential;
    S.authGen++;
    start();
  }
  function renderGoogleButton() {
    var slot = document.getElementById('gsi-slot');
    if (!slot) return;
    if (MOCK) {
      slot.innerHTML = '<button type="button" class="button primary" data-mock-signin>（作り物）サインイン</button> ' +
        '<button type="button" class="button ghost" data-mock-signin="b">（作り物）別の人でサインイン</button>';
      return;
    }
    var tries = 0;
    (function wait() {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({ client_id: C.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true, use_fedcm_for_prompt: true });
        google.accounts.id.renderButton(slot, { theme: 'outline', size: 'large', text: 'signin_with' });
        google.accounts.id.prompt();
      } else if (tries++ < 50) {
        setTimeout(wait, 200);
      } else {
        slot.textContent = 'Google のサインイン部品を読み込めませんでした。ページを読み込み直してください。';
      }
    })();
  }
  function signOut() {
    if (movesPending()) { toast('移動の保存が終わってから、サインアウトしてください。', 'error'); return; }
    if (S.write) { toast('保存が終わってから、サインアウトしてください。', 'error'); return; }
    if (S.openId) { closeDetail(false); if (S.openId) return; }   // 書きかけがあれば閉じてよいか確かめる
    if (!MOCK && window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    parkMoves();
    S.token = null; S.user = null; S.tabs = null; S.authGen++; closeDetail(true);
    S.snapId = null; S.outcome = null; S.paidOpen = false; $('#outcome').innerHTML = '';
    showScreen('signin', 'サインアウトしました。');
  }

  // ---- 起動と一覧 ----
  // 起動は list の1往復（計画 ar-app-perf §3-1 K1）。list の応答に利用者・既定値が入っている
  async function start() {
    var g = S.authGen;
    showScreen('loading');
    await untilNoForeground();          // 前の世代の書き込みの通信と、新しい一覧を並走させない（段D §9-10-1 の5）
    if (g !== S.authGen) return;        // 待つ間にさらに世代が変わった: この起動は捨てる
    await loadList(perfScene('boot'));
  }

  // 利用者・担当・既定の日数を画面へ入れる（list か bootstrap の応答から）
  function applyBoot(info) {
    S.user = info.user;
    useStashOf(V.tokenSub(S.token) || S.user.email);
    S.ownerGen = S.authGen;
    $('#who').textContent = S.user.email;
    applyStaff(info, true);
    if (info.defaults && typeof info.defaults.minDays === 'number') { S.days = info.defaults.minDays; $('#days').value = String(S.days); }
  }

  // 右上の「担当」と担当の選択肢を入れる（list・bootstrap の応答から）。起動のときは既定（営業は自分、それ以外は全社）を選ぶ。
  // 取り直しのときは今の選択を保つ（選択肢から消えていれば全社）。features が無いサーバ（戻したとき）なら「全社」だけにする
  function applyStaff(info, isBoot) {
    S.features = info.features && info.features.assignee ? info.features : null;
    S.staff = S.features ? (info.staff || []) : [];
    var choices = S.features ? V.staffChoices(S.staff) : [{ value: V.ALL_STAFF, label: '全社' }];
    if (isBoot) S.staffSel = S.features ? V.defaultStaff(S.user, S.staff) : V.ALL_STAFF;
    if (!choices.some(function (c) { return c.value === S.staffSel; })) S.staffSel = V.ALL_STAFF;
    $('#staff').innerHTML = choices.map(function (c) { return '<option value="' + esc(c.value) + '">' + esc(c.label) + '</option>'; }).join('');
    $('#staff').value = S.staffSel;
  }

  // 担当の応答（state）を、同じ取引先のカードへ合わせる
  function applyAssigneeState(st) {
    if (st && typeof st.assignee === 'string') V.applyAssignee(allCards(), st.partnerId, st.assignee, st.assigneeRecordId);
  }

  // 詳細の要求。担当に対応したサーバには、担当の履歴の絞り込みに使う取引先ID を添える（§3-3）
  function detailBody(id, extra) {
    var card = findCard(id);
    var body = { billingId: id };
    if (S.features && card && card.partnerId) body.partnerId = card.partnerId;
    return Object.assign(body, extra || {});
  }

  // 控えの持ち主を切り替える。今の持ち主の控えはしまい、新しい持ち主の控え（無ければ空）を出す
  function useStashOf(key) {
    if (S.ownerKey === key) return;
    if (S.ownerKey !== null) S.stashes[S.ownerKey] = { lost: S.lost, unsettled: S.unsettled };
    var st = S.stashes[key] || { lost: {}, unsettled: {} };
    delete S.stashes[key];
    S.lost = st.lost; S.unsettled = st.unsettled; S.ownerKey = key;
  }

  // 一覧を取る。読むだけなので、壊れた応答・打ち切り・通信の失敗は1回だけ自動で取り直す（W1 で分かったこと1）。
  // 「取り直し中」はサインインの世代ごと。前の世代の取り直しが残っていても、新しい世代は待たずに取る（その応答は捨てられる）
  // bootCtx があれば起動（K1）: 応答の利用者・既定値を先に入れる。古いサーバ（list に利用者が無い）なら bootstrap で補う（計画 §5-4）
  async function loadList(bootCtx) {
    if (S.listBusy && S.listGen === S.authGen) return;
    var boot = !!bootCtx;
    // 書き込みと一覧の取り直しは並走させない（段C §8-11-2 の7）。起動のときは書き込みが無い
    if (!boot && movesPending()) { toast('移動の保存が終わってから、もう一度「更新」を押してください。', 'error'); return; }
    if (!boot && S.write) { toast('保存が終わってから、もう一度「更新」を押してください。', 'error'); return; }
    var g = S.authGen;
    var ctx = bootCtx || perfScene('list');
    S.listBusy = true; S.listGen = g;
    $('#refresh').disabled = true;
    syncSaveButton();
    if (!S.tabs) showScreen('loading');
    try {
      var r = await api('list', null, { ctx: ctx });
      if (g !== S.authGen) return;     // 待つ間にサインインが切れた・拒否された・入れ替わった
      if (r.kind === 'broken' || r.kind === 'timeout' || r.kind === 'network') r = await api('list', null, { ctx: ctx, retry: 1 });
      if (g !== S.authGen) return;
      if (handleAuthFailure(r)) return;
      if (boot) {
        var info = r.json && r.json.user ? r.json : null;
        if (!info && r.kind === 'ok') {
          var rb = await api('bootstrap', null, { ctx: ctx });
          if (g !== S.authGen) return;
          if (handleAuthFailure(rb)) return;
          if (rb.kind !== 'ok') { showScreen('error', V.failureText(rb.kind, rb.code)); perfEnd(ctx, V.perfResult(rb)); return; }
          info = rb.json;
        }
        if (info) applyBoot(info);
      }
      if (r.kind !== 'ok') {
        var why = r.kind === 'fail' && r.code === 'MF_PAGE_LIMIT' ? '件数が上限（1,000件）を超えたため、一部だけを表示することはしません。管理者に連絡してください。' : V.failureText(r.kind, r.code);
        if (S.tabs) toast('一覧を取り直せませんでした: ' + why + '（前回の内容を表示しています）', 'error');
        else showScreen('error', why);
        perfEnd(ctx, V.perfResult(r));
        return;
      }
      // 置き換える前の、開いている請求と書きかけ（一覧から消えたときの回収に使う。§8-14-2 の I2）
      var openId = S.openId;
      var openCard = openId ? findCard(openId) : null;
      var openWish = openCard && !locked(openId) ? V.draftWish(openCard, S.draftStatus, S.draftMemo, S.features ? S.draftAssignee : null) : null;
      S.tabs = r.json.tabs;
      S.fetchedAt = r.json.fetchedAt;
      S.warnings = r.json.warnings || [];
      // 成果表示: 描いた一覧の控えを裏で送る。fetchedAtMs の無い古いサーバ（@6）には送らない（§3-3・O-G2 ⑫）
      S.outcome = null; S.snapId = null;
      try {   // 成果の通信を始められなくても、一覧の表示は止めない（成果を出さないだけ）
        if (typeof r.json.fetchedAtMs === 'number') { S.snapId = newOpId(); sendOutcome(V.snapshotOf(S.tabs, r.json.fetchedAtMs), S.snapId, g).catch(function (x) { console.error(x); }); }   // 通信の後の失敗も記録する（成果が出ないだけ）
      } catch (x) { console.error(x); S.snapId = null; S.outcome = null; }
      if (!boot && r.json.user) applyStaff(r.json, false);   // 取り直しでも担当の対応を見直す（サーバを戻したとき、担当を出さない）
      // ★ 未確定（unsettled）・保存されなかったメモ（lost）は取り直しでは外さない。一覧から消えても「要確認」に残る
      if (openId && S.openId === openId && !findCard(openId)) {
        // 書きかけは、希望の全項目として要確認へ移してから閉じる（段C §8-13-1 の3）
        if (openWish && !V.wishEmpty(openWish)) V.addWish(S.lost, openId, openCard.partner, '一覧を取り直したら、この請求は一覧から消えていました（入金済みなど）。保存していません', openWish, { key: 'draft:' + newOpId(), billingNumber: openCard.billingNumber });
        closeDetail(true);
        toast('開いていた請求は入金済みになり、一覧から消えました。' + (openWish && !V.wishEmpty(openWish) ? '書きかけは「要確認」に残しています。' : ''));
      }
      if (S.screen === 'main') refreshViews(); else showScreen('main');   // 取り直しの後も共通の入口で描く（段C C2 N1）
      perfEnd(ctx, 'ok');
    } finally {
      if (S.listGen === g) { S.listBusy = false; $('#refresh').disabled = !!S.write || movesPending(); checkReady(); }
    }
  }

  function allCards() { return S.tabs ? S.tabs['未入金'].concat(S.tabs['未設定']) : []; }
  function findCard(id) { return allCards().filter(function (c) { return c.billingId === id; })[0] || null; }
  function tabOf(card) { return S.tabs && S.tabs['未設定'].indexOf(card) >= 0 ? '未設定' : '未入金'; }

  // ---- 画面の切り替え ----
  function showScreen(name, message) {
    S.screen = name;
    S.screenMessage = message || '';
    var main = name === 'main';
    $('#main').hidden = !main;
    $('#session').hidden = !(main || name === 'loading' || name === 'error') || !S.user;
    $('#special').innerHTML = main ? '' : stateScreen();
    if (name === 'signin') renderGoogleButton();
    if (main) renderMain();
  }

  function stateScreen() {
    var screens = {
      signin: ['✦', 'サインイン', S.screenMessage || '許可されたメンバーが利用できます。Google アカウントでサインインしてください。', '<div id="gsi-slot"></div>'],
      config: ['!', '接続先が設定されていません', 'この画面の接続先（config.js の GAS_URL）がまだ空です。管理者に連絡してください。', ''],
      stale: ['!', '画面のファイルが古いままです', 'ブラウザに前の版のファイルが残っています。Ctrl＋Shift＋R（スマートフォンはページを閉じて開き直す）で読み込み直してください。', ''],
      loading: ['◌', '請求を読み込み中', '一覧を取得しています。少々お待ちください。', '<span class="spinner" aria-label="読み込み中">◌</span>'],
      error: ['!', '一覧を取得できませんでした', esc(S.screenMessage) + '。通信状態を確認して、もう一度お試しください。', '<button type="button" class="button primary" data-retry>再試行</button>'],
      denied: ['×', 'アクセスできません', 'このアカウントは利用を許可されていません。管理者に次の識別子を伝えてください。',
        '<div class="identifier">' + esc(S.deniedSub || '（識別子を受け取れませんでした）') + '</div><p style="margin-top:14px"><button type="button" class="button small ghost" data-signout>別のアカウントでサインイン</button></p>']
    };
    var s = screens[S.screen];
    var desc = S.screen === 'signin' ? esc(s[2]) : s[2];
    return '<div class="state-screen"><span class="symbol" aria-hidden="true">' + s[0] + '</span><h2>' + s[1] + '</h2><p>' + desc + '</p>' + s[3] + '</div>';
  }

  // ---- 一覧の描画（検索欄などの入力部品は描き直さない。入力中のフォーカスを保つため） ----
  function visibleCards() {
    return V.sortCards(V.filterCards(S.tabs[S.tab], { days: S.days, query: S.query,
      staff: S.features ? S.staffSel : V.ALL_STAFF, staffList: S.staff }), S.sort);
  }

  function renderMain() {
    if (!S.tabs) return;
    var data = visibleCards();
    var sum = V.summarize(data);
    $('#count-unpaid').textContent = S.tabs['未入金'].length;
    $('#count-unset').textContent = S.tabs['未設定'].length;
    $('#stat-count').textContent = sum.count + '件';
    $('#stat-total').textContent = V.yen(sum.total);
    $('#stat-untouched').textContent = sum.untouched + '件';
    $('#shown-count').textContent = data.length + '件を表示';
    $('#filter-description').textContent = S.days > 0 ? (S.tab === '未入金' ? '支払期限から' : '作成日から') + S.days + '日以上' : 'すべて（期日前を含む）';
    $('#last-fetch').textContent = S.fetchedAt ? S.fetchedAt + ' 取得' : '—';
    $('#drag-hint').textContent = canDrag ? ' カードをレーンへドラッグしても連絡状況を変えられます。' : '';
    $('#warnings').innerHTML = S.warnings.length ? '<div class="notice">' + S.warnings.map(esc).join('<br>') + '</div>' : '';
    document.querySelectorAll('[data-tab]').forEach(function (x) { x.setAttribute('aria-selected', String(x.dataset.tab === S.tab)); });
    $('#list').innerHTML = listHTML(data);
    $('#refresh').disabled = S.listBusy || !!S.write || movesPending();   // 保存中・移動の保存待ちは一覧を取り直さない（段C §8-11-2 の7・段D §9-3 の9）
    renderMoveBar();
    renderAttention();
    try { renderOutcome(); } catch (x) { console.error(x); }   // 成果の描画の失敗で、一覧の描画を止めない
  }

  // ---- 成果表示（ar-app-outcome §3-3。見た目はモック A案） ----
  // outcome は裏の通信（bg）。前景に数えないので、保存・ドラッグ・詳細の保存・更新・サインアウトを止めない。
  // 応答を使うのは、サインインの世代と、今表示している一覧の札（snapId）が同じときだけ（古い応答を捨てる。O-G2 ⑥）
  async function sendOutcome(snapshot, snapId, g) {
    if (snapshot.i.length > V.SNAP_MAX_ITEMS) { S.outcome = { tooMany: true }; if (S.screen === 'main') renderOutcome(); return; }
    var ctx = perfScene('outcome');
    var body = { snapshot: snapshot, snapId: snapId };
    var r = await api('outcome', body, { bg: true, ctx: ctx });
    if (g === S.authGen && snapId === S.snapId && (r.kind === 'broken' || r.kind === 'timeout' || r.kind === 'network')) {
      r = await api('outcome', body, { bg: true, ctx: ctx, retry: 1 });   // 1回だけ送り直す（同じ控え・同じ札。サーバは STALE で二重に書かない）
    }
    perfEnd(ctx, r.kind === 'ok' && r.json.paidUnknown ? 'unknown' : V.perfResult(r));
    if (g !== S.authGen || snapId !== S.snapId) return;
    if (r.kind === 'ok' && r.json.snapId === snapId) S.outcome = r.json;
    else S.outcome = r.kind === 'fail' && r.code === 'TOO_LARGE' ? { tooLarge: true } : null;   // そのほかの失敗は何も出さない（§3-3）
    if (S.screen === 'main') renderOutcome();
  }

  function cardsById() {
    var m = {};
    allCards().forEach(function (c) { m[c.billingId] = c; });
    return m;
  }

  function renderOutcome() {
    if (!S.tabs) return;
    var o = S.outcome;
    var view = o && o.ok ? V.outcomeView(o, S.tab, S.features ? S.staffSel : V.ALL_STAFF, S.staff, cardsById()) : null;
    var boxes = [['count', false], ['total', true], ['untouched', false]];
    boxes.forEach(function (b) {
      var el = $('#delta-' + b[0]);
      $('#stat-box-' + b[0]).classList.toggle('has-delta', !!view);
      el.hidden = !view;
      if (!view) { el.innerHTML = ''; return; }
      var key = b[0] === 'total' ? 'amount' : b[0];
      el.innerHTML = '<span class="delta-head">前回から</span>' +
        '<span class="delta plus">' + esc(V.deltaText('＋', view.plus[key], b[1])) + '</span>' +
        '<span class="delta minus">' + esc(V.deltaText('−', view.minus[key], b[1])) + '</span>';
    });
    var note = $('#compare-note');
    var text = o && o.tooLarge ? '前回の控えが大きすぎて保存できませんでした。' :
      o && o.tooMany ? '一覧が ' + V.SNAP_MAX_ITEMS.toLocaleString('ja-JP') + '件を超えたため、前回からの増減を出せません。管理者に連絡してください。' :
      o && o.ok ? V.outcomeNote(o) : '';
    note.hidden = !text;
    note.textContent = text;
    var area = $('#outcome');
    if (!view || view.paidUnknown || !view.paid.length) { area.innerHTML = ''; return; }
    var open = S.paidOpen;
    area.innerHTML =
      '<button type="button" class="achievement" data-paid-toggle aria-expanded="' + open + '" aria-controls="paid-area">' +
        '<span class="spark" aria-hidden="true">✦</span>' +
        '<span class="achievement-copy"><small>前回からの成果</small><strong>入金で解消 ' + view.paid.length + '件 · ' + esc(V.yen(view.paidTotal)) + '</strong>' +
        '<span class="sub">未入金一覧から消えた案件を、成果として確認できます。</span></span>' +
        '<span class="toggle">' + (open ? '表示中 · 閉じる ↑' : '入金された案件を見る ↓') + '</span></button>' +
      (open ? '<section class="paid-area" id="paid-area" aria-label="入金で解消した案件"><div class="paid-area-head"><div><h2>✦ 入金で解消した案件</h2>' +
        '<p>前回から入金が確認され、未入金一覧から外れました。</p></div><button type="button" class="button small ghost" data-paid-toggle>閉じる ↑</button></div>' +
        '<div class="paid-list">' + view.paid.map(function (x) {
          // 入金済みのカードは開かない・ドラッグしない（UI-2）。時刻は出さない（UI-4）
          return '<article class="paid-card"><span class="check">✓ 入金を確認</span><h3>' + esc(x.partner) +
            (x.billingNumber ? ' <small>No.' + esc(x.billingNumber) + '</small>' : '') + '</h3><strong>' + esc(V.yen(x.amount)) + '</strong>' +
            (S.features ? '<p>' + esc(V.assigneeLabel(S.staff, x.assignee || '')) + '</p>' : '') + '</article>';
        }).join('') + '</div></section>' : '');
  }

  // 「要確認」: 確定できていない操作と、保存されなかったメモ。一覧とは別に置く（請求が一覧から消えても取り出せる。W5 第3巡 指摘2）
  function renderAttention() {
    var items = V.attentionItems(S.unsettled, S.lost);
    $('#attention').innerHTML = !items.length ? '' :
      '<section class="attention" aria-label="要確認"><h3>要確認（' + items.length + '件）</h3>' + items.map(function (it) {
        var inList = !!findCard(it.id);
        var open = inList ? '<button type="button" class="button small ghost" data-open="' + esc(it.id) + '">詳細を開く</button>' : '<span class="muted">一覧にはありません（入金済みなど）</span>';
        // 書かれなかったと決まった希望は「この内容で開き直す」（自動では送らない）。未確定の間・書き込み中の請求では出さない（§8-13-1 の1）
        var reopen = it.kind === 'lost' && it.wish && inList && !locked(it.id) && !(S.write && S.write.id === it.id) && !has(S.moves, it.id)
          ? '<button type="button" class="button small ghost" data-reopen-wish="' + esc(it.id) + '" data-idx="' + it.idx + '">この内容で開き直す</button>' : '';
        var act = it.kind === 'unsettled'
          ? '<button type="button" class="button small primary" data-settle-id="' + esc(it.id) + '">保存できたかを確かめる</button>'
          : '<button type="button" class="button small ghost" data-dismiss-lost="' + esc(it.id) + '" data-idx="' + it.idx + '">この控えを消す</button>';
        var lines = it.wish ? V.wishLines(it.wish, S.staff) : [];
        var wishHtml = lines.length ? '<div class="muted">変えようとした内容: ' + lines.map(esc).join('／') + '</div>' : '';
        var uk = 'att:' + it.kind + ':' + it.id + ':' + (it.key || (it.kind === 'lost' ? 'i' + it.idx : ''));
        var memo = it.memo !== null && it.memo !== undefined && it.memo !== ''
          ? '<details data-ui-key="' + esc(uk) + ':d"><summary>書いたメモを見る</summary><textarea readonly data-ui-key="' + esc(uk) + ':t">' + esc(it.memo) + '</textarea></details>' : '';
        return '<div class="attention-item"><strong>' + esc(it.partner) + '</strong>' + (it.billingNumber ? ' <span class="billing-no">No.' + esc(it.billingNumber) + '</span>' : '') + ' — ' + esc(it.text) + wishHtml + '<div class="attention-actions">' + act + reopen + open + '</div>' + memo + '</div>';
      }).join('') + '</section>';
  }

  function statusClass(s) { return { '未納品': 'undelivered', 'ノータッチ': 'untouched', '連絡あり': 'incoming', '連絡済み': 'contacted' }[s] || 'untouched'; }
  function statusBadge(s) { return '<span class="status-chip status-' + statusClass(s) + '">' + esc(s) + '</span>'; }
  function dateLabel(tab) { return tab === '未入金' ? '支払期日' : '作成日'; }
  function dateOf(card, tab) { return tab === '未入金' ? card.dueDate : card.createdAt; }

  // 書き込み中の請求は、確定した状態に書き込み中の希望を重ねて見せる（段C §8-11-2 の6）。読み取りの応答は確定した状態にだけ当たる
  // 保存待ち（段D）の請求は、移す先を重ねて見せる（§9-3 の8）
  function pendingWish(c) {
    if (S.write && S.write.id === c.billingId && S.write.kind !== 'settle') return S.write.wish;
    return has(S.moves, c.billingId) ? { status: S.moves[c.billingId].to } : null;
  }
  function shownStatus(c) { var w = pendingWish(c); return w && w.status !== undefined ? w.status : c.status; }
  function shownMemo(c) { var w = pendingWish(c); return w && w.memo !== undefined ? w.memo : c.memo; }

  function cardHTML(c) {
    var lastLine = V.lastActLine(c.last);   // 確定した記録の1行（保存待ち・未確定の希望は出さない。§3-3-3）
    var unsettled = locked(c.billingId);
    var writing = !!(S.write && S.write.id === c.billingId);
    var waiting = has(S.moves, c.billingId);
    var status = shownStatus(c);
    var drag = canDrag && !unsettled && !writing ? ' draggable="true"' : '';
    return '<button type="button" class="invoice-card' + (S.openId === c.billingId ? ' is-active' : '') + (unsettled || writing ? ' is-pending' : '') + '"' + drag +
      ' data-open="' + esc(c.billingId) + '" aria-label="' + esc(c.partner) + (c.billingNumber ? ' 請求番号 ' + esc(c.billingNumber) : '') + ' ' + esc(c.title) + ' ' + V.yen(c.amount) + ' ' + esc(status) +
      (S.features ? ' 担当 ' + esc(V.assigneeLabel(S.staff, c.assignee)) : '') + (writing ? ' 保存中' : unsettled ? ' 未確定' : waiting ? ' 保存待ち' : '') + (c.paidMark ? ' 入金済み' : '') + (lastLine ? ' 最新の記録 ' + esc(lastLine) : '') + ' 詳細を開く">' +
      '<span class="card-top"><span><span class="client">' + esc(c.partner) + '</span>' +
      (c.billingNumber ? '<span class="billing-no" title="請求番号">No.' + esc(c.billingNumber) + '</span>' : '') + '<span class="subject">' + esc(c.title) + '</span></span>' +
      (writing ? '<span class="unsettled-mark">保存中</span>' : unsettled ? '<span class="unsettled-mark">未確定</span>' : waiting ? '<span class="unsettled-mark">保存待ち</span>' : '') +
      (c.paidMark ? '<span class="unsettled-mark">入金済み</span>' : '') + '</span>' +
      // 担当の札は金額の下（メモ3行の左の空き）に置く。取引先名の右では長い名前に押されて切れた（ユーザー依頼 2026-09-30）
      '<span class="money-row"><span class="money-left"><span class="amount">' + V.yen(c.amount) + '</span>' +
      (S.features ? '<span class="assignee-tag' + (V.isUnassigned(S.staff, c.assignee) && !c.assignee ? ' none' : '') + '" title="担当">' + esc(V.assigneeLabel(S.staff, c.assignee)) + '</span>' : '') + '</span>' +
      '<span class="memo-excerpt" title="メモの先頭3行">' + esc(V.memoExcerpt(shownMemo(c))) + '</span></span>' +
      (lastLine ? '<span class="last-act" title="' + esc(lastLine) + '">' + esc(lastLine) + '</span>' : '') +
      '<span class="card-bottom"><span class="date">' + dateLabel(S.tab) + ' ' + V.jpDate(dateOf(c, S.tab)) + '</span>' +
      '<span class="age ' + V.ageClass(c.days) + '">' + V.ageLabel(S.tab, c.days) + '</span>' + statusBadge(status) + '</span></button>';
  }

  function listHTML(data) {
    if (!data.length) return '<div class="state-screen list-empty"><span class="symbol" aria-hidden="true">✓</span><h2>条件に合う請求はありません</h2><p>経過日数や検索の条件を変えて確認してください。</p></div>';
    return V.STATUSES.map(function (status) {
      var items = data.filter(function (x) { return V.laneOf(shownStatus(x)) === status; });
      return '<section class="lane" data-lane="' + status + '" aria-label="' + status + '"><div class="lane-head"><span>' + status + '</span><b>' + items.length + '件</b></div>' +
        '<div class="lane-stack">' + (items.map(cardHTML).join('') || '<div class="lane-empty">該当なし</div>') + '</div></section>';
    }).join('');
  }

  // ---- 詳細（中央に重ねて開く。A-1） ----
  // 詳細の読み込みには世代番号を付け、開き直し・読み直しの後に届いた古い応答は捨てる（W5 第3巡 指摘1）
  async function openDetail(id) {
    var card = findCard(id);
    if (!card) return;
    S.openId = id; S.openPartner = card.partner; S.draftStatus = null; S.draftMemo = null; S.draftAssignee = null; S.notice = null;
    S.detail = { loading: true, records: [] };
    var gen = ++S.detailGen;
    var ctx = has(S.unsettled, id) ? null : perfScene('detail');
    renderDetail(true);
    renderMain();
    // 保存ボタンが押せるようになった時点（K2 の readyMs。承認済みの意味）。前の保存・一覧の読み込みの間は、押せるようになるまで追う（段C C2 R1）
    if (ctx) { readyWatch = { ctx: ctx, id: id }; checkReady(); }
    // 前の保存・移動が未確定なら、記録を読む代わりに確定を頼む（確定の答えに記録も入っている）
    if (has(S.unsettled, id)) {
      S.notice = { kind: 'unknown', text: '' };   // 確かめている間は保存させない。文言は出さない（段D §9-4）
      renderDetail();
      if (!(await runSettle(id))) {
        // 読み込みの途中などで始められなかった
        S.detail = { loading: false, records: [] };
        S.notice = { kind: 'unknown', done: 'failed',
          text: '前の操作が保存できたかを、まだ確かめられていません。「もう一度確かめる」を押してください。確かめるまで、この請求は保存も移動もできません。' };
        refreshViews();                  // 非同期の応答の後は共通の入口で描く（変換中は待つ・選択を保つ。段C C2 N1）
      }
      return;
    }
    await fetchDetail(id, gen, ctx);
  }

  // 記録を取り直す。世代が変わっていれば捨てる。
  // 記録は記録ID で重ねずに合わせる（保存の応答で先に入った1行を消さない）。カードは記録ID が今より新しいときだけ合わせる（計画 ar-app-perf §3-2 K2）。
  // ctx があれば開いた直後の読み込み（背景の読み取り。保存の開始を妨げない）
  async function fetchDetail(id, gen, ctx) {
    var g = S.authGen;
    var r = await api('detail', detailBody(id), ctx ? { ctx: ctx, bg: true } : null);
    // 計測の行は、保存ボタンが押せるようになるまで（または閉じるまで）待ってから残す（段C C2 R1）
    if (ctx) { ctx.pendingResult = V.perfResult(r); if (!(readyWatch && readyWatch.ctx === ctx)) flushDetailPerf(ctx); }
    if (g !== S.authGen || S.openId !== id || gen !== S.detailGen) return false;
    if (handleAuthFailure(r)) return false;
    // 状態は今すぐ反映し、描き直しは共通の入口（refreshViews）で行う。変換中は描き直しを待ち、フォーカス・選択を保つ（段C C2 N1）
    if (r.kind !== 'ok') { S.detail = { loading: false, records: S.detail ? S.detail.records : [], assigneeHistory: S.detail ? S.detail.assigneeHistory : [], error: V.failureText(r.kind, r.code) }; refreshViews(); return false; }
    var recs = V.mergeRecords(S.detail ? S.detail.records : [], r.json.records || []);
    var card = findCard(id);
    if (card && recs.length && recs[0].recordId > (card.lastRecordId || 0)) {
      card.status = recs[0].status; card.memo = recs[0].memo; card.lastRecordId = recs[0].recordId;
    }
    applyLast(card, r.json.last);
    // 担当の履歴は records と分けて持ち、記録ID で重ねずに合わせる（第1巡 指摘1。保存の応答で先に入った1行を消さない）
    // 取引先が食い違ったときは、前に読んだ履歴も合わせずに捨てる（別の取引先の履歴を残さない。H1 実装レビュー第1巡 指摘2）
    var hist = r.json.partnerMismatch ? [] : V.mergeRecords(S.detail ? S.detail.assigneeHistory : [], r.json.assigneeHistory || []);
    applyAssigneeState(r.json.state);
    S.detail = { loading: false, records: recs, assigneeHistory: hist, partnerMismatch: !!r.json.partnerMismatch };
    refreshViews();
    return true;
  }

  function hasDraft(card) {
    return !!card && V.buildUpdate(card, S.draftStatus, S.draftMemo, S.features ? S.draftAssignee : null) !== null;
  }

  function closeDetail(force) {
    var id = S.openId;
    var card = findCard(id);
    if (!force && !locked(id) && hasDraft(card) && !window.confirm('保存していない変更があります。閉じてよいですか？')) return;
    // 保存されなかったメモは S.lost・S.unsettled が持っているので、閉じても要確認に残る（知らせには持たせていない）
    S.openId = null; S.detail = null; S.notice = null; S.draftStatus = null; S.draftMemo = null; S.draftAssignee = null;
    S.detailGen++;
    $('#detail').innerHTML = '';
    document.body.style.overflow = '';
    checkReady();                      // 押せる前に閉じた詳細の計測の行を残す（段C C2 R1）
    if (S.tabs && S.screen === 'main') renderMain();
    // 一覧は描き直しているので、開いたカードを請求IDで探し直してフォーカスを戻す
    var back = id ? document.querySelector('.invoice-card[data-open="' + CSS.escape(id) + '"]') : null;
    if (back) back.focus();
  }

  function renderDetail(focus) {
    var card = findCard(S.openId);
    if (!card) { $('#detail').innerHTML = ''; return; }
    var tab = tabOf(card);
    var memoEl = document.getElementById('memo');
    var keepCaret = memoEl && document.activeElement === memoEl ? [memoEl.selectionStart, memoEl.selectionEnd] : null;
    // 描き直すと中の部品が作り直されるので、詳細の中にあったフォーカスを失わないように覚えておく
    var hadFocus = $('#detail').contains(document.activeElement);
    var focusKey = hadFocus ? focusKeyOf(document.activeElement) : null;   // 描き直しても同じ部品へ戻す（段C B-T4）
    var writing = !!(S.write && S.write.id === S.openId);
    var current = S.draftStatus !== null ? S.draftStatus : shownStatus(card);
    var memo = S.draftMemo !== null ? S.draftMemo : shownMemo(card);
    // 書き込み中・未確定の請求は操作させない（その請求だけ。段C §8-11-2 の2）。読み直し中・衝突・入金済みも、読み直すまで保存させない
    var moveWait = has(S.moves, S.openId);
    var busy = writing || moveWait || locked(S.openId) ||
      (S.notice && ((S.notice.kind === 'unknown' && S.notice.done !== 'ok') || S.notice.kind === 'conflict' || S.notice.kind === 'paid'));
    // 別の請求の保存中・一覧などの読み込み中は、書けるが保存ボタンだけ待たせる（段C §8-11-1・C2 R1。計測の readyMs と同じ条件）
    var waitPrev = !busy && !canSaveNow();
    var choices = V.STATUSES.map(function (s) {
      return '<button type="button" class="choice" data-choice="' + s + '" aria-pressed="' + (current === s) + '"' + (busy ? ' disabled' : '') + '><span class="dot"></span>' + s + '</button>';
    }).join('');
    var d = S.detail || { loading: true, records: [] };
    // 読み込み中でも、保存の応答で先に入った記録は出す（K2）
    var lines = V.detailLines(d.records, S.features && !d.partnerMismatch ? d.assigneeHistory : [], S.staff).map(function (h) { return '<div class="history-item"><small>' + esc(h.when) + ' ・ ' + esc(h.who) + '</small><strong>' + esc(h.content) + '</strong></div>'; }).join('');
    var hist = d.loading ? lines + '<div class="history-item">読み込み中…</div>' : (lines || '<div class="history-item">記録はまだありません</div>');
    if (d.error) hist = '<div class="history-item">記録を読めませんでした（' + esc(d.error) + '）。<button type="button" class="button small ghost" data-reload-detail>読み直す</button></div>' + hist;
    $('#detail').innerHTML =
      '<div class="overlay" data-overlay><article class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1">' +
      '<header class="detail-header"><div class="detail-header-top"><span class="eyebrow">請求の詳細 · 請求番号 ' + esc(card.billingNumber) + '</span>' +
      '<button class="button small ghost" type="button" data-close>✕ 閉じる</button></div>' +
      '<h2 id="detail-title">' + esc(card.partner) + '</h2><div class="subject">' + esc(card.title) + '</div>' +
      '<div class="detail-meta"><strong class="amount">' + V.yen(card.amount) + '</strong><span class="pill">' + dateLabel(tab) + ' ' + V.jpDate(dateOf(card, tab)) + '</span>' +
      '<span class="pill">' + V.ageLabel(tab, card.days) + '</span>' + statusBadge(shownStatus(card)) + (writing ? '<span class="pill">保存中</span>' : moveWait ? '<span class="pill">保存待ち</span>' : '') + '</div></header>' +
      '<div class="detail-body">' + noticeHTML() + lostBoxHTML() +
      // 左に連絡状況とメモ、右に担当と記録。左右の先頭をそろえる（ユーザー依頼 2026-09-27）
      '<div class="detail-columns"><section><h3>連絡状況を選ぶ</h3><div class="status-choices" role="group" aria-label="連絡状況" style="margin-bottom:16px">' + choices + '</div>' +
      '<h3>メモ <small style="font-weight:500">（上書き）</small></h3>' +
      '<textarea class="note-area" id="memo" maxlength="5000" placeholder="先方への連絡内容や次の予定を記入"' + (busy ? ' disabled' : '') + '>' + esc(memo) + '</textarea>' +
      '<div class="limit" id="limit">' + memo.length + ' / 5,000文字</div></section>' +
      '<section>' + assigneeHTML(card, busy) + '<h3>記録（新しい順）</h3><div class="history">' + hist + '</div></section></div>' +
      '<div class="detail-actions"><button type="button" class="button teal" data-save' + (busy ? ' data-card-busy' : '') + (busy || waitPrev ? ' disabled' : '') + '>' +
      (waitPrev ? waitLabel() : writing ? '保存しています…' : moveWait ? '移動の保存を待っています' : '変更をまとめて保存') + '</button>' +
      // 移動の保存待ちがあれば、詳細を開いたまま送り出せる（止まった送り出しの再開も。書きかけを閉じずに済む。段D 実装レビュー第1巡 R1）
      (hasMoves() ? '<button type="button" class="button small primary" data-move-now>移動を今すぐ保存（' + Object.keys(S.moves).length + '件' + (S.moveState === 'stopped' ? '・止まっています' : '') + '）</button>' : '') +
      '<span class="feedback" role="status">' + (S.notice && (S.notice.kind === 'saved' || S.notice.kind === 'info') ? esc(S.notice.text) : '') + '</span></div>' +
      '</div></article></div>';
    document.body.style.overflow = 'hidden';
    var m = document.getElementById('memo');
    var back = focusKey ? document.querySelector(focusKey) : null;
    if (keepCaret && m && !m.disabled) { m.focus(); m.setSelectionRange(keepCaret[0], keepCaret[1]); }
    else if (back && !back.disabled) back.focus();
    else if (focus || hadFocus) document.querySelector('.detail-panel').focus();
  }
  // 描き直しをまたいで、フォーカス・選択・開閉・詳細の位置を保つ（段C C2 R2）。
  // 部品は安定した印（data-ui-key、要確認・控えのボタンの data 属性）で探し直す
  function uiSelectorOf(el) {
    if (!el || !el.getAttribute || el === document.body) return null;
    var k = el.getAttribute('data-ui-key');
    if (k) return '[data-ui-key="' + CSS.escape(k) + '"]';
    if (el.id === 'memo' || el.id === 'search') return '#' + el.id;
    var inAtt = el.closest && el.closest('#attention');
    var scope = inAtt ? '#attention ' : el.closest && el.closest('#detail') ? '#detail ' : '';
    var attrs = ['data-settle-id', 'data-reopen-wish', 'data-dismiss-lost', 'data-choice', 'data-assignee'];
    for (var i = 0; i < attrs.length; i++) {
      if (el.hasAttribute(attrs[i])) {
        var sel = scope + '[' + attrs[i] + '="' + CSS.escape(el.getAttribute(attrs[i])) + '"]';
        if (el.hasAttribute('data-idx')) sel += '[data-idx="' + CSS.escape(el.getAttribute('data-idx')) + '"]';
        return sel;
      }
    }
    if (el.hasAttribute('data-open')) return (inAtt ? '#attention ' : '') + (el.classList.contains('invoice-card') ? '.invoice-card' : 'button') + '[data-open="' + CSS.escape(el.dataset.open) + '"]';
    if (el.hasAttribute('data-close')) return '#detail [data-close]';
    if (el.hasAttribute('data-save')) return '#detail [data-save]';
    if (el.hasAttribute('data-move-now')) return el.closest('#detail') ? '#detail [data-move-now]' : '#move-bar [data-move-now]';   // 段D 実装レビュー第2巡 R5
    return null;
  }
  function captureUI() {
    var a = document.activeElement;
    var sel = null;
    try { if (a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') && typeof a.selectionStart === 'number') sel = [a.selectionStart, a.selectionEnd, a.selectionDirection]; } catch (e) { sel = null; }
    var open = Array.prototype.map.call(document.querySelectorAll('details[data-ui-key][open]'), function (d) { return d.getAttribute('data-ui-key'); });
    var panel = document.querySelector('.detail-panel');
    return { key: uiSelectorOf(a), sel: sel, open: open, panelTop: panel ? panel.scrollTop : null };
  }
  function restoreUI(u) {
    if (!u) return;
    u.open.forEach(function (k) { var d = document.querySelector('details[data-ui-key="' + CSS.escape(k) + '"]'); if (d) d.open = true; });
    var panel = document.querySelector('.detail-panel');
    if (panel && u.panelTop !== null) panel.scrollTop = u.panelTop;
    var el = u.key ? document.querySelector(u.key) : null;
    if (el && !el.disabled && document.activeElement !== el) el.focus({ preventScroll: true });
    if (el && u.sel && el.setSelectionRange) { try { el.setSelectionRange(u.sel[0], u.sel[1], u.sel[2]); } catch (e) { /* 選べない部品 */ } }
  }
  // 入力の変換中（IME）は描き直さない。変換が終わったら、待っていた描き直しを行う（段C C2 R2）
  document.addEventListener('compositionstart', function () { S.composing = true; });
  document.addEventListener('compositionend', function () {
    S.composing = false;
    if (S.refreshPending) { S.refreshPending = false; setTimeout(refreshViews, 0); }
  });

  // 詳細の中の部品を、描き直した後に探し直すための選び方（連絡状況・担当・閉じる・保存）
  function focusKeyOf(el) {
    if (!el || !el.dataset) return null;
    if (el.dataset.choice) return '#detail [data-choice="' + CSS.escape(el.dataset.choice) + '"]';
    if (el.hasAttribute('data-assignee')) return '#detail [data-assignee="' + CSS.escape(el.dataset.assignee) + '"]';
    if (el.hasAttribute('data-close')) return '#detail [data-close]';
    if (el.hasAttribute('data-save')) return '#detail [data-save]';
    if (el.hasAttribute('data-move-now')) return el.closest('#detail') ? '#detail [data-move-now]' : '#move-bar [data-move-now]';   // 段D 実装レビュー第2巡 R5
    return null;
  }

  // 「この取引先の担当」（ar-app-assignee §2-2 の1）。担当に対応していないサーバ・取引先ID の無い請求では押せるボタンを出さない
  function assigneeHTML(card, busy) {
    if (!S.features) return '';
    var head = '<h3>この取引先の担当</h3>';
    if (!card.partnerId) return head + '<p class="assignee-note">取引先を特定できないため担当を付けられません。</p>';
    if (S.detail && S.detail.partnerMismatch) return head + '<p class="assignee-note">取引先が変わった可能性があります。一覧を取り直してください。</p>';
    var now = card.assignee || '';
    var current = S.draftAssignee !== null ? S.draftAssignee : now;
    var btn = function (email, label, disabled) {
      return '<button type="button" class="choice" data-assignee="' + esc(email) + '" aria-pressed="' + (current === email) + '"' + (busy || disabled ? ' disabled' : '') + '>' + esc(label) + '</button>';
    };
    // 同じ取引先で担当を変える書き込みが、送信中・未確定のまま残っている間は押せない（段C §8-11-2 の3・§8-13-2 の1）
    var plock = V.partnerAssigneeLocked(S.write, S.unsettled, card.partnerId);
    var list = S.staff.filter(function (x) { return x.active; }).map(function (x) { return btn(x.email, x.name, plock); });
    if (now && V.isUnassigned(S.staff, now)) list.unshift(btn(now, V.assigneeLabel(S.staff, now), true));   // 無効の営業は選び直せない
    list.push(btn('', '未割り当て', plock));
    return head + (plock ? '<p class="assignee-note">同じ取引先の担当を保存中・確認中のため、担当は変えられません。連絡状況・メモは保存できます。</p>' : '') +
      '<div class="status-choices assignee-choices" role="group" aria-label="この取引先の担当" style="margin-bottom:16px">' + list.join('') + '</div>';
  }

  function noticeHTML() {
    var n = S.notice;
    if (!n || n.kind === 'saved' || n.kind === 'info' || !n.text) return '';
    var btn = '';
    if (n.kind === 'conflict') btn = '<br><button type="button" class="button small ghost" data-reload-detail style="margin-top:10px">最新の内容を表示</button>';
    if (n.kind === 'paid') btn = '<br><button type="button" class="button small ghost" data-reload-list style="margin-top:10px">一覧を取り直す</button>';
    if (n.kind === 'unknown' && n.done === 'failed') btn = locked(S.openId)
      ? '<br><button type="button" class="button small ghost" data-settle-id="' + esc(S.openId) + '" style="margin-top:10px">もう一度確かめる</button>'
      : '<br><button type="button" class="button small ghost" data-reload-detail style="margin-top:10px">もう一度読み直す</button>';
    return '<div class="notice' + (n.kind === 'error' || n.kind === 'conflict' ? ' error' : '') + '" role="alert">' + esc(n.text) + btn + '</div>';
  }

  // 「保存されなかった変更」欄。知らせとは別に、S.unsettled（確定前）と S.lost の控え（すべて）を表示する。
  // 連絡状況を選ぶ・読み直す・閉じるでは消えない。消えるのは「消す」を押したときと、同じ内容の保存が成功したとき（メモだけの古い控え）だけ
  function lostBoxHTML() {
    var id = S.openId;
    var out = '';
    var u = has(S.unsettled, id) ? S.unsettled[id] : null;
    if (u) {
      var ul = V.wishLines(u.wish, S.staff);
      out += '<div class="notice lost-memo" role="note">保存できたかを確かめています' + (ul.length ? '（' + ul.map(esc).join('／') + '）' : '') +
        (u.lostMemo ? '。書いたメモ（必要ならコピーしてください）<textarea readonly data-ui-key="box:u:' + esc(id) + '">' + esc(u.lostMemo) + '</textarea>' : '') + '</div>';
    }
    (has(S.lost, id) ? S.lost[id].items : []).forEach(function (it, idx) {
      var wl = it.wish ? V.wishLines(it.wish, S.staff) : [];
      out += '<div class="notice lost-memo" role="note">' + (it.memo === null || it.memo === ''
        ? '保存されなかった変更（' + esc(it.text) + (wl.length ? '。' + wl.map(esc).join('／') : '') + '）'
        : '保存されなかったメモ' + (it.text ? '（' + esc(it.text) + (wl.length ? '。' + wl.map(esc).join('／') : '') + '）' : '') + '。必要ならコピーして、メモ欄に貼り直してください<textarea readonly data-ui-key="box:l:' + esc(id) + ':' + idx + '">' + esc(it.memo) + '</textarea>') +
        '<button type="button" class="button small ghost" data-dismiss-lost="' + esc(id) + '" data-idx="' + idx + '">この控えを消す</button></div>';
    });
    return out;
  }

  // 保存（計画 §3-5）。1回の保存＝変わった項目だけを1回送る。
  // 段C 案B+（§8-11・§8-13）: 押したらすぐ詳細を閉じ、裏で1件だけ送る。書きかけは操作の希望に写してある
  function save() {
    var id = S.openId;
    var card = findCard(id);
    if (!card || locked(id) || (S.write && S.write.id === id) || has(S.moves, id)) return;
    if (!canSaveNow()) { refuseWrite('save'); return; }
    var da = S.features ? S.draftAssignee : null;
    var dropped = null;
    // 同じ取引先の担当が保存中・未確定なら、担当は黙って送らず・黙って外さず、本人に選ばせる（§8-11-2 の3）
    if (da !== null && da !== (card.assignee || '') && V.partnerAssigneeLocked(S.write, S.unsettled, card.partnerId)) {
      if (!window.confirm('同じ取引先の担当を確かめているため、担当は保存できません。\n\n［OK］担当を外して、連絡状況・メモだけを保存する\n［キャンセル］保存しないで待つ（書きかけは残ります）')) return;
      dropped = da; da = null;
    }
    var body = V.buildUpdate(card, S.draftStatus, S.draftMemo, da);
    if (!body) {
      S.notice = { kind: 'info', text: dropped !== null ? '担当のほかに変更はありません。同じ取引先の担当を確かめ終わってから、もう一度保存してください' : '変更はありません' };
      renderDetail();
      return;
    }
    body.opId = newOpId();
    var op = newOp('save', card, body);
    var ctx = perfScene('save');
    // 外した担当の希望も、詳細を閉じた後に回収できるように要確認へ残す（§8-14-2 の I2）
    if (dropped !== null) V.addWish(S.lost, id, card.partner, '担当は保存していません（同じ取引先の担当を確かめていたため）', { assignee: dropped }, { key: 'draft:' + newOpId(), billingNumber: card.billingNumber });
    closeDetail(true);
    runWrite(op, function () { return saveInner(op, body, ctx); }, 'save');
    ctx.readyMs = Math.round(performance.now() - ctx.t0);   // 押してから、詳細を閉じて一覧を描き直し終わるまで（実測。§8-11-2 の9）
  }

  async function saveInner(op, body, ctx) {
    var r = await api('update', body, { ctx: ctx, keepalive: true });
    perfEnd(ctx, V.perfResult(r), { readyMs: ctx.readyMs });
    if (!stillMine(op)) return;          // サインインが切れた後の古い応答は捨てる（切れた瞬間に未確定にしてある。§8-13-1 の2）
    if (handleAuthFailure(r)) return;
    var id = op.id;
    var card = findCard(id);
    if (r.kind === 'ok') {
      if (card) applyState(card, r.json.state);
      applyLast(card, r.json.state && r.json.state.last);
      // 保存されなかったメモと同じ内容が保存できたら、メモだけの古い控えは役目を終えた
      V.removeLostMemo(S.lost, id, r.json.state.memo);
      // 記録の欄へ保存した1行を足す（その請求の詳細が開いているときだけ。K2）
      if (!r.json.unchanged && S.detail && S.openId === id) {
        S.detail.records = V.mergeRecords(S.detail.records, [{ recordId: r.json.state.lastRecordId, at: r.json.state.at, status: r.json.state.status, memo: r.json.state.memo,
          statusChanged: body.status !== undefined, memoChanged: body.memo !== undefined, email: S.user ? S.user.email : '' }]);
      }
      var st = r.json.state;
      if (!V.assigneeSaved(body, st)) {
        // 旧サーバに戻っていた: 連絡状況・メモだけが保存され、担当は捨てられた。担当の希望だけを要確認に残す（§8-14-1 の P1）
        V.addWish(S.lost, id, op.partner, '担当は保存されませんでした（担当に対応していない版のサーバでした）。一覧を取り直してから、もう一度操作してください', { assignee: body.assignee }, opMeta(op));
        toast('「' + op.partner + '」の' + (body.status !== undefined || body.memo !== undefined ? '連絡状況・メモは保存しましたが、' : '') + '担当は保存されませんでした。「要確認」を見てください。', 'error');
        return;
      }
      if (st && typeof st.assignee === 'string') {
        var prevAsg = card ? card.assignee || '' : '';
        applyAssigneeState(st);
        if (body.assignee !== undefined && !r.json.unchanged && st.assigneeRecordId === st.lastRecordId && S.detail && S.openId === id) {
          S.detail.assigneeHistory = V.mergeRecords(S.detail.assigneeHistory || [], [{ recordId: st.assigneeRecordId, at: st.at, email: S.user ? S.user.email : '',
            billingNumber: card ? card.billingNumber : '', sameBilling: true, from: prevAsg, to: st.assignee }]);
        }
      }
      toast(r.json.unchanged ? '「' + op.partner + '」は変更がありませんでした' : '✓ 「' + op.partner + '」を保存しました');
      return;
    }
    if (r.kind === 'fail') {
      var why = V.failureText(r.kind, r.code);
      var paid = r.code === 'PAID_OR_OUT_OF_SCOPE' || r.code === 'NOT_FOUND';
      if (r.code === 'CONFLICT' && card && r.json.state) { applyState(card, r.json.state); applyLast(card, r.json.state.last); }
      if (paid && card) card.paidMark = true;   // 一覧は自動では取り直さない（§8-13-1 の3）
      // 書かれなかったと決まった: 希望の全項目を要確認の1件にまとめてから、その操作を外す（§8-13-1 の1）
      V.addWish(S.lost, id, op.partner, why + '。保存していません', op.wish, opMeta(op));
      toast('「' + op.partner + '」を保存できませんでした（' + why + '）。書いた内容は「要確認」に残しています。' + (paid ? '一覧を取り直すと消えます。' : ''), 'error');
      return;
    }
    // 壊れた応答・打ち切り・通信の失敗: 書けたかどうか分からない。送り直さず、その操作IDの確定を頼む（G12 ④・§6-13）
    S.unsettled[id] = unsettledOf(op);
    await settleInner(id, perfScene('settle'), op);
  }

  // 未確定の操作の「確定」を、書き込みとして1つだけ走らせる
  function runSettle(id) {
    var u = S.unsettled[id];
    if (!u) return Promise.resolve(false);
    var ctx = perfScene('settle');
    var op = { opId: u.opId, id: id, partnerId: u.partnerId || '', partner: u.partner, billingNumber: u.billingNumber || '', kind: 'settle', wish: u.wish || {}, gen: S.authGen, owner: S.ownerKey };
    return runWrite(op, function () { return settleInner(id, ctx, op); }, 'detail');
  }

  // 未確定の操作の「確定」を頼む（§6-13）。サーバはロックの中で、その操作IDの記録があれば written、
  // 無ければ取り消しの印を付けて cancelled を返す。どちらでも、その後にその操作が書かれることは無い。
  // 答えを受け取れなければ未確定のまま残し、その請求を操作させない（要確認から、いつでも確かめ直せる）
  // 返す値（段D の送り出しが続けるか止めるかを決める。§9-9-2）: written・cancelled・unknown（決まらない）・auth・discard（古い応答）・gone
  async function settleInner(id, ctx, op) {
    var u = S.unsettled[id];
    if (!u) return 'gone';
    var mv = !!(op && op.kind === 'drag');   // 移動の送り出しの中の確定（詳細の readyMs はこの通信を待たない。§9-11）
    var r = await api('detail', detailBody(id, { settleOpId: u.opId }), ctx ? { ctx: ctx, move: mv } : { move: mv });
    if (ctx) perfEnd(ctx, r.kind === 'ok' && r.json.settled ? r.json.settled : r.kind === 'ok' ? 'unknown' : V.perfResult(r));
    if (op && !stillMine(op)) return 'discard';   // サインインが切れた後の古い応答は捨てる（未確定の控えは残っている）
    if (handleAuthFailure(r)) return 'auth';
    if (S.unsettled[id] !== u) return 'gone';     // 確定の間に別の経路で片付いていた
    var card = findCard(id);
    var open = S.openId === id;
    if (r.kind !== 'ok' || !r.json.settled) {
      var why = r.kind === 'ok' ? '答えを読めませんでした' : V.failureText(r.kind, r.code);
      if (open) {
        S.detail = { loading: false, records: S.detail ? S.detail.records : [] };
        S.notice = { kind: 'unknown', done: 'failed',
          text: '前の操作が保存できたかを、まだ確かめられていません（' + why + '）。「もう一度確かめる」を押してください。確かめるまで、この請求は保存も移動もできません。' };
      } else if (!mv) {
        toast('「' + u.partner + '」の操作が保存できたかを確かめられませんでした（' + why + '）。画面上の「要確認」から確かめてください。', 'error');
      }
      return 'unknown';
    }
    var w = u.wish || { memo: u.lostMemo || undefined, assignee: u.assignee, status: u.kind === 'drag' ? u.to : undefined };
    delete S.unsettled[id];
    if (card) applyState(card, r.json.state);
    applyLast(card, r.json.last);        // written は確定済みの最新の1行へ、cancelled は書かれなかった希望を出さない（サーバは記録からだけ求める）
    applyAssigneeState(r.json.state);
    var written = r.json.settled === 'written';
    // 保存できていたなら、通常の保存成功と同じく、保存後のメモと同じ内容のメモだけの控えを外す（差分確認 第2巡 条件）
    if (written && r.json.state) V.removeLostMemo(S.lost, id, r.json.state.memo);
    // 書けていても、担当が保存できたかはその操作の行の証拠（settledOp）で判断する。今の担当の欄は証拠にしない
    // （旧サーバが書いた後に新サーバで確定すると、今の担当は入るが、その操作では担当を変えていない。H1 実装レビュー第1巡 指摘1・第2巡 指摘1）
    // 担当が保存されなかった・確かめられないときは、担当の希望だけを要確認に残す（§8-14-1 の P1）
    var asgRes = written && u.assignee !== undefined ? V.settledAssignee(u.assignee, r.json) : 'na';
    var asgLost = asgRes === 'notSaved' || asgRes === 'unknown';
    if (asgRes === 'notSaved') V.addWish(S.lost, id, u.partner, '担当は保存されませんでした（担当に対応していない版のサーバが書いていました）。一覧を取り直してから、もう一度操作してください', { assignee: u.assignee }, opMeta(u));
    if (asgRes === 'unknown') V.addWish(S.lost, id, u.partner, '担当が保存できたかを確かめられませんでした（担当に対応していない版のサーバが答えました）。一覧を取り直して担当を確かめ、違っていればもう一度操作してください', { assignee: u.assignee }, opMeta(u));
    // 取り消した（書かれなかったと決まった）: 希望の全項目を要確認の1件にまとめる（§8-13-1 の1）
    if (!written) V.addWish(S.lost, id, u.partner, '保存はできていませんでした（取り消しました）', w, opMeta(u));
    if (open) {
      S.detailGen++;                   // 確定の答え（記録つき）を正とする。これより前に始めた読み込みの応答は捨てる
      S.detail = { loading: false, records: r.json.records || [], assigneeHistory: r.json.assigneeHistory || [], partnerMismatch: !!r.json.partnerMismatch };
      S.notice = asgLost
        ? { kind: 'error', text: '連絡状況・メモは保存できていました（記録の先頭）。' + (asgRes === 'unknown' ? '担当が保存できたかは確かめられませんでした。一覧を取り直して担当を確かめてください。' : '担当は保存されませんでした。一覧を取り直してから、もう一度操作してください。') }
        : written
        ? { kind: 'saved', text: '✓ 保存できていました（記録の先頭）' }
        : { kind: 'unknown', done: 'ok',
          text: '保存されていませんでした。この操作は取り消したので、あとから書かれることはありません。最新の内容を表示しています。書いた内容は「要確認」に残しています。' };
    }
    if ((u.kind === 'drag' || !open) && !mv) {
      toast(asgLost ? '「' + u.partner + '」の連絡状況・メモは保存できていましたが、担当は' + (asgRes === 'unknown' ? '保存できたかを確かめられませんでした' : '保存されませんでした') + '。「要確認」を見てください。'
        : written ? '「' + u.partner + '」の' + (u.kind === 'drag' ? ' ' + u.to + ' への移動' : '保存') + 'はできていました'
        : '「' + u.partner + '」の' + (u.kind === 'drag' ? '移動' : '保存') + 'はできていませんでした（取り消しました）。書いた内容は「要確認」に残しています。', written && !asgLost ? '' : 'error');
    }
    return written ? 'written' : 'cancelled';
  }

  // 「最新の内容を表示」「読み直す」。書きかけのメモは知らせの中に残す（消さない）。読み直すまで保存させない
  async function reloadDetail() {
    var id = S.openId;
    if (!id || (S.write && S.write.id === id)) return;
    var gen = ++S.detailGen;
    S.draftStatus = null; S.draftMemo = null; S.draftAssignee = null;
    S.notice = { kind: 'unknown', text: '' };   // 読み直す間は保存させない。文言は出さない（段D §9-4）
    renderDetail();
    var ok = await fetchDetail(id, gen);
    if (S.openId !== id || gen !== S.detailGen) return;
    // 「最新の内容を表示しました」は出さない。書いた内容を控えに残している、ときだけ言う（段D §9-4）
    S.notice = ok
      ? (has(S.lost, id) ? { kind: 'info', text: '最新の内容を表示しました（あなたが書いた内容は「保存されなかった変更」に残しています）' } : null)
      : { kind: 'unknown', done: 'failed', text: '最新の状態を読み直せませんでした。「もう一度読み直す」を押してください。読み直すまで保存はできません。' };
    refreshViews();
  }

  // 記録ID が今より古い状態では戻さない（K2。遅れて届いた応答でカードを巻き戻さない）
  function applyState(card, st) {
    if (!V.newerState(card, st)) return;
    card.status = st.status; card.memo = st.memo; card.lastRecordId = st.lastRecordId;
  }

  // カードの最新の記録の1行（督促の支援 段1）。受け取った last.recordId が今の1行より大きいときだけ進める（V.newerLast）
  function applyLast(card, last) {
    if (card) card.last = V.newerLast(card.last, last);
  }

  // 要確認の「この内容で開き直す」: 詳細を開き、希望の全項目を書きかけとして入れる。自動では送らない（§8-13-1 の1）。
  // 別の請求の書きかけは、閉じる確認を通す（§8-14-2 の I2）
  function reopenWish(id, idx) {
    var e = S.lost[id];
    var it = e && e.items[idx];
    if (!it || !it.wish || !findCard(id) || locked(id) || (S.write && S.write.id === id) || has(S.moves, id)) return;
    if (S.openId) { closeDetail(false); if (S.openId) return; }
    openDetail(id);                      // 書きかけを空にして開く（ここまでは同期で進む）
    if (S.openId !== id) return;
    if (it.wish.status !== undefined) S.draftStatus = it.wish.status;
    if (it.wish.memo !== undefined) S.draftMemo = it.wish.memo;
    if (it.wish.assignee !== undefined && S.features) S.draftAssignee = it.wish.assignee;
    renderDetail();
  }

  // ---- ドラッグ＆ドロップ（パソコンだけ。§3-5）。段D: すぐには送らず保存待ちに入れ、3秒ドラッグが途切れたら1件ずつ送る ----
  // 断るのは、一覧の取り直し中・その請求が未確定・その請求が送信中のときだけ（§9-3 の2）。ほかの書き込みの最中でも受け付ける
  function moveByDrag(id, toStatus) {
    var card = findCard(id);
    if (!card || locked(id) || (S.write && S.write.id === id)) return;
    if (S.listBusy) { refuseWrite('drag'); return; }
    var ctx = perfScene('drag');
    var res = V.moveAdd(S.moves, { id: id, to: toStatus, base: card.lastRecordId || 0, partner: card.partner, partnerId: card.partnerId || '',
      billingNumber: card.billingNumber || '', owner: S.ownerKey, gen: S.authGen, seq: ++S.moveSeq, ctx: ctx }, card.status);
    if (res === 'none') return;
    restartMoveTimer();
    refreshViews();
    ctx.readyMs = Math.round(performance.now() - ctx.t0);   // 落としてから、移した先を描き終わるまで（実測）
  }

  // 移した先は書き込み中の上書き（shownStatus）で見せ、確定した状態は応答でだけ変える（§8-11-2 の6）。
  // 段D: 1件ごとの知らせは出さず（まとめの知らせ）、結果を「続ける／止める／世代が変わった／捨てた」に分けて返す（§9-9-2・§9-10-2）
  async function moveInner(op, body, ctx) {
    var r = await api('update', body, { ctx: ctx, keepalive: true, move: true });
    var o = V.moveOutcome(r);
    // 計測の場面（落としてから結果が決まるまで。§9-11）は、確定の問い合わせが要るときは、その答えが出てから閉じる（段D 実装レビュー第1巡 R2）
    if (o !== 'unknown') perfEnd(ctx, V.perfResult(r), { readyMs: ctx.readyMs });
    if (!stillMine(op)) { if (o === 'unknown') perfEnd(ctx, V.perfResult(r), { readyMs: ctx.readyMs }); return { o: 'discard' }; }
    if (handleAuthFailure(r)) return { o: 'auth' };
    var card = findCard(op.id);
    if (r.kind === 'ok') {
      if (card) applyState(card, r.json.state);
      applyLast(card, r.json.state && r.json.state.last);
      S.moveTally.saved++;
      return { o: 'continue' };
    }
    if (o === 'unknown') {
      // 書けたかどうか分からない（G12 ④）。未確定にして確定を頼む。一覧の取り直しでは外さない。決まれば続け、決まらなければ止める
      var first = V.failureText(r.kind, r.code);
      S.unsettled[op.id] = unsettledOf(op);
      var s = await settleInner(op.id, perfScene('settle'), op);
      perfEnd(ctx, s === 'written' || s === 'cancelled' || s === 'unknown' ? s : V.perfResult(r), { readyMs: ctx.readyMs });
      if (s === 'written') { S.moveTally.saved++; return { o: 'continue' }; }
      if (s === 'cancelled') { S.moveTally.failed++; return { o: 'continue' }; }
      if (s === 'unknown') { S.moveTally.unknown++; return { o: 'stop', why: first }; }
      return { o: s === 'gone' ? 'continue' : s };
    }
    var why = V.failureText(r.kind, r.code);
    var paid = r.code === 'PAID_OR_OUT_OF_SCOPE' || r.code === 'NOT_FOUND';
    if (r.code === 'CONFLICT' && card && r.json.state) { applyState(card, r.json.state); applyLast(card, r.json.state.last); }
    if (paid && card) card.paidMark = true;   // 一覧は自動では取り直さない（§8-13-1 の3）
    V.addWish(S.lost, op.id, op.partner, why + '。移していません', op.wish, opMeta(op));
    S.moveTally.failed++;
    return o === 'continue' ? { o: 'continue' } : { o: 'stop', why: why };
  }

  // ---- 小さな知らせ ----
  var toastTimer = null;
  function toast(text, kind) {
    var el = $('#toast');
    el.textContent = text;
    el.className = 'banner toast' + (kind ? ' ' + kind : '');
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, kind === 'error' ? 8000 : 4000);
  }

  // ---- 操作の受け取り（段C: 書き込みの間も受け付ける。止めるものは各関数が断る） ----
  document.addEventListener('click', function (e) {
    if (e.target.matches && e.target.matches('[data-overlay]')) { closeDetail(false); return; }
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.tab) { S.tab = b.dataset.tab; renderMain(); }
    else if (b.dataset.open) { if (S.openId) closeDetail(false); if (!S.openId) openDetail(b.dataset.open); }
    else if (b.hasAttribute('data-close')) closeDetail(false);
    else if (b.dataset.choice) { S.draftStatus = b.dataset.choice; S.notice = null; renderDetail(); }
    else if (b.hasAttribute('data-assignee')) { S.draftAssignee = b.dataset.assignee; S.notice = null; renderDetail(); }
    else if (b.hasAttribute('data-save')) save();
    else if (b.hasAttribute('data-refresh')) loadList();
    else if (b.hasAttribute('data-paid-toggle')) { S.paidOpen = !S.paidOpen; renderOutcome(); }   // 「入金で解消」の行全体で開閉（UI-1）
    else if (b.hasAttribute('data-move-now')) kickMoves('now');   // 3秒を待たずに送り出す・止まった送り出しを続ける（段D §9-3 の4・6）
    else if (b.hasAttribute('data-reload-list')) loadList();   // 開いている請求が一覧から消えたら、書きかけを要確認へ移してから閉じる（loadList）
    else if (b.hasAttribute('data-reload-detail')) reloadDetail();
    else if (b.dataset.settleId) {
      var sid = b.dataset.settleId;
      if (S.openId === sid) { S.notice = { kind: 'unknown', text: '' }; renderDetail(); }   // 文言は出さない（段D §9-4）
      runSettle(sid);
    }
    else if (b.dataset.reopenWish) reopenWish(b.dataset.reopenWish, Number(b.dataset.idx));
    else if (b.dataset.dismissLost) { V.dismissLost(S.lost, b.dataset.dismissLost, Number(b.dataset.idx)); renderAttention(); if (S.openId) renderDetail(); }
    // 今のサインインで起動が済んでいれば一覧だけ、済んでいなければ起動から（A2 第2巡 指摘1）
    else if (b.hasAttribute('data-retry')) { if (S.user && S.ownerGen === S.authGen) loadList(); else start(); }
    else if (b.hasAttribute('data-signout')) signOut();
    else if (b.hasAttribute('data-mock-signin')) onCredential({ credential: b.dataset.mockSignin === 'b' ? window.AR_MOCK_TOKEN_B : 'mock' });
  }, true);

  document.addEventListener('input', function (e) {
    if (e.target.id === 'search') { S.query = e.target.value; renderMain(); }
    else if (e.target.id === 'memo') { S.draftMemo = e.target.value; $('#limit').textContent = e.target.value.length + ' / 5,000文字'; }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'days') { S.days = Number(e.target.value); renderMain(); }
    else if (e.target.id === 'sort') { S.sort = e.target.value; renderMain(); }
    else if (e.target.id === 'staff') { S.staffSel = e.target.value; renderMain(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && S.openId) closeDetail(false);
  }, true);

  // ドラッグ（pointer が細かい端末だけ。draggable は cardHTML が付ける）
  document.addEventListener('dragstart', function (e) {
    var c = e.target.closest && e.target.closest('.invoice-card[draggable=true]');
    if (!c) return;
    // 段D: ほかの書き込みの最中でもドラッグを始められる。断るのは一覧の取り直し中だけ（送信中・未確定のカードは draggable が無い。§9-3 の2）
    if (S.listBusy) { e.preventDefault(); refuseWrite('drag'); return; }
    e.dataTransfer.setData('text/plain', c.dataset.open);
    e.dataTransfer.effectAllowed = 'move';
    c.classList.add('dragging');
  });
  document.addEventListener('dragend', function (e) {
    if (e.target.classList) e.target.classList.remove('dragging');
    document.querySelectorAll('.lane.drop-target').forEach(function (l) { l.classList.remove('drop-target'); });
  });
  document.addEventListener('dragover', function (e) {
    var lane = e.target.closest && e.target.closest('.lane');
    if (!lane) return;
    e.preventDefault();
    document.querySelectorAll('.lane.drop-target').forEach(function (l) { if (l !== lane) l.classList.remove('drop-target'); });
    lane.classList.add('drop-target');
  });
  document.addEventListener('drop', function (e) {
    var lane = e.target.closest && e.target.closest('.lane');
    if (!lane) return;
    e.preventDefault();
    lane.classList.remove('drop-target');
    var id = e.dataTransfer.getData('text/plain');
    if (id) moveByDrag(id, lane.dataset.lane);
  });

  // 書き込みの途中・未確定・移動の保存待ちが残っている間にページを離れようとしたら確かめる
  // （書き込みの要求は keepalive で送り切る。段C §8-11-2 の8。保存待ちの移動は送っていないので、閉じると消える。段D §9-2）
  window.addEventListener('beforeunload', function (e) {
    // 推奨は preventDefault。returnValue は古いブラウザ向けで、真の値を入れる（MDN の beforeunload。空の文字列では出ない版がある）
    if (S.write || Object.keys(S.unsettled).length || hasMoves()) { e.preventDefault(); e.returnValue = true; }
  });

  // ---- 軽い計測（計画 ar-app-perf §3-3 L）----
  // ★ 利用者には見せず、業務の通信・書き込みの排他・待ちの表示に関わらない（計画レビュー第1巡 指摘2）。
  //   計測の失敗はすべて握りつぶす（業務を止めない）。端末の待ち行列は持ち主ごと（A の行は A のサインイン中だけ送る。同 指摘3）
  var P = { device: canDrag ? 'pc' : 'phone', sim: MOCK || new URLSearchParams(location.search).get('sim') === '1', sending: false, dropped: {} };
  // 場面は始めたときのサインインの世代を持つ。終わったときに世代が変わっていれば行を捨てる（A2 第1巡 指摘1）
  function perfScene(name) { return { sid: newOpId(), scene: name, t0: performance.now(), seq: 0, rows: [], done: false, gen: S.authGen }; }
  // 今の世代で持ち主が決まっていれば、その持ち主。決まっていなければ null（起動の前・起動に失敗した）
  function perfOwner() { return S.ownerKey && S.ownerGen === S.authGen ? S.ownerKey : null; }
  function perfBase(ctx) { return { mid: newOpId(), sid: ctx.sid, scene: ctx.scene, device: P.device, sim: P.sim, ts: Date.now() }; }
  function perfReq(ctx, action, retry, rid, t0, r) {
    try {
      ctx.rows.push(Object.assign(perfBase(ctx), { rid: rid, action: action, seq: ++ctx.seq, retry: retry, result: V.perfResult(r),
        rtMs: Math.round(performance.now() - t0) }, r && r.json ? V.perfServerFields(r.json) : {}));
    } catch (e) { /* 計測の失敗は無視 */ }
  }
  function perfEnd(ctx, result, extra) {
    try {
      if (!ctx || ctx.done) return;
      ctx.done = true;
      if (ctx.gen !== S.authGen) return;  // 始めた後にサインインが替わった（前の人の応答）。別の持ち主へ入れない
      var key = perfOwner();
      if (!key) return;                  // 持ち主が分からない（起動に失敗した）行は残さない
      var row = Object.assign(perfBase(ctx), { rid: '', action: '', seq: 0, retry: 0, result: result, totalMs: Math.round(performance.now() - ctx.t0) }, extra || {});
      var k = 'arPerfQ:' + key;
      var a = V.perfQueueAdd(perfLoad(k), ctx.rows.concat([row]), Date.now());
      perfStore(k, a.queue);
      P.dropped[key] = (P.dropped[key] || 0) + a.dropped;
      setTimeout(perfFlush, 1500);
    } catch (e) { /* 計測の失敗は無視 */ }
  }
  // 断られた操作（K3 の材料）: 操作できる状態に戻るまでの待ちを数える
  function perfRejected(kind) {
    try {
      var ctx = perfScene('rejected');
      var iv = setInterval(function () {
        if (canWrite() || performance.now() - ctx.t0 > 60000) { clearInterval(iv); perfEnd(ctx, 'rejected', { action: kind }); }
      }, 100);
    } catch (e) { /* 計測の失敗は無視 */ }
  }
  function perfLoad(k) { try { var v = JSON.parse(localStorage.getItem(k) || '[]'); return Array.isArray(v) ? v : []; } catch (e) { return []; } }
  function perfStore(k, q) { try { if (q.length) localStorage.setItem(k, JSON.stringify(q)); else localStorage.removeItem(k); } catch (e) { /* 保存できなければ計測を捨てる */ } }
  // 業務の通信が走っていないときに、今サインインしている人の行だけを送る。受け取られた行だけ端末から消す
  async function perfFlush() {
    var key = perfOwner();               // 今の資格情報の持ち主の行だけを、その資格情報で送る
    if (P.sending || !S.token || !key || S.write || S.inflight > 0 || S.listBusy) return;
    var k = 'arPerfQ:' + key;
    var q = perfLoad(k);
    if (!q.length) return;
    P.sending = true;
    try {
      var r = await perfSend({ action: 'perf', idToken: S.token, rows: q.slice(0, 20).map(V.perfWire), dropped: P.dropped[key] || 0 });
      if (r && r.kind === 'ok' && Array.isArray(r.json.accepted)) {
        perfStore(k, V.perfQueueRemove(perfLoad(k), r.json.accepted));
        P.dropped[key] = 0;
        if (perfLoad(k).length) setTimeout(perfFlush, 3000);
      }
    } catch (e) { /* 次の機会に */ } finally {
      P.sending = false;
    }
  }
  // 業務の api とは別の経路（通信数・待ちの表示・計測の対象に入れない）
  async function perfSend(payload) {
    if (MOCK) return V.classifyResponse(await window.AR_MOCK_API(payload));
    var ctrl = new AbortController();
    var timer = setTimeout(function () { ctrl.abort(); }, C.TIMEOUT_MS);
    try {
      var res = await fetch(C.GAS_URL, { method: 'POST', body: new URLSearchParams({ payload: JSON.stringify(payload) }), signal: ctrl.signal });
      return V.classifyResponse({ text: await res.text() });
    } catch (e) {
      return null;
    } finally {
      clearTimeout(timer);
    }
  }
  setInterval(perfFlush, 20000);

  // ---- 起動 ----
  if (!V || V.VERSION !== VIEW_VERSION) { showScreen('stale'); return; }   // 新旧のファイルが混ざったら、止まる前に知らせる
  if (!C.GAS_URL && !MOCK) { showScreen('config'); return; }
  if (!MOCK) {
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    document.head.appendChild(s);
  } else {
    var m = document.createElement('script');
    m.src = 'ar-mock.js';
    m.onload = function () { window.dispatchEvent(new Event('DOMContentLoaded')); };
    document.head.appendChild(m);
  }
  showScreen('signin');
})();
</script>
</body>
</html>
