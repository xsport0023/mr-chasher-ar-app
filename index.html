<title>売掛ウォッチ</title>
<!--
  売掛ウォッチ（未入金売掛アプリ フェーズ1）の画面。計画 docs/change-plan-未入金売掛アプリ.md §3-5・§3-8・G10・G12。
  見た目は承認済みのモック 案A（連絡レーン）＋A-1（詳細は中央に重ね、中でメモ左・記録右）。docs/ar-app/W2-モック承認記録.md
  ★ 画面に出す文字はすべて esc() を通す。データは GAS から受け取るだけで、このファイルにも公開リポジトリにも置かない。
  ★ 外部から読むのは Google のサインイン部品（accounts.google.com/gsi/client）だけ。
-->
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;color:#19152a;background:#f5f1ff;font-synthesis:none}
*{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select,textarea{font:inherit}button{cursor:pointer}

.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}

.mascot i:after{content:'';position:absolute;background:#1d1830;width:4px;height:6px;border-radius:50%;top:3px;left:3px}
.eyebrow{font-size:11px;font-weight:900;letter-spacing:.13em;color:#554d81;margin:0 0 3px}
h1{font-size:29px;letter-spacing:-.04em;line-height:1.15;margin:0;font-weight:950}
.subtitle{font-size:12px;color:#685f7c;margin:5px 0 0}
.session{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:9px;font-size:12px}
.session label{font-weight:850}.session select{min-width:100px}
.email{font-weight:700;color:#534c69;overflow-wrap:anywhere}
.control,.button,.status-chip,.tab,.pill{border:2px solid #1d1830;background:#fff;border-radius:15px;box-shadow:3px 4px 0 #1d1830}
.control{height:42px;padding:0 13px;max-width:100%}
.button{padding:11px 16px;font-weight:900;white-space:nowrap;color:#1d1830;transition:transform .12s,box-shadow .12s}
.button:hover:not(:disabled){transform:translate(1px,2px);box-shadow:2px 2px 0 #1d1830}

.button.primary{background:#ffce49}.button.teal{background:#42d7b2}.button.ghost{background:#fff}

.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:0 0 20px}
.stat{min-height:103px;background:#fff;border:3px solid #1d1830;border-radius:21px;box-shadow:5px 6px 0 #1d1830;padding:17px 20px;display:flex;flex-direction:column;justify-content:space-between}

.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:18px 0 12px}
.section-head h2{font-size:21px;margin:0}.section-head p{font-size:12px;color:#696176;margin:4px 0 0}
.tabs{display:flex;gap:9px;flex-wrap:wrap}
.tab{font-weight:900;padding:10px 17px;color:#201a32}
.tab[aria-selected=true]{background:#6556ed;color:white}

.list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;align-items:start}
.lane{border:3px solid #1d1830;border-radius:23px;padding:13px;min-width:0;min-height:330px;background:#ffe0e7;box-shadow:5px 6px 0 #1d1830;transition:outline-color .1s}
.lane:nth-child(2){background:#ffdfa1}.lane:nth-child(3){background:#c9f4e7}

.invoice-card{border:3px solid #1d1830;background:#fff;border-radius:18px;box-shadow:5px 6px 0 #1d1830;padding:12px;display:block;color:inherit;text-align:left;min-width:0;width:100%;transition:transform .12s,box-shadow .12s}
.invoice-card:hover{transform:translate(2px,2px);box-shadow:3px 4px 0 #1d1830}
.invoice-card.is-active{outline:4px solid #6556ed;outline-offset:3px}
.invoice-card.is-pending{opacity:.55}
.attention{border:3px solid #1d1830;border-radius:20px;background:#fff4cc;box-shadow:4px 5px 0 #1d1830;padding:14px 16px;margin:0 0 20px}.attention h3{margin:0 0 8px;font-size:15px}.attention-item{border-top:1px dashed #cfc6d9;padding:10px 0;font-size:13px;line-height:1.6}.attention-item:first-of-type{border-top:0}.attention-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}.attention textarea{width:100%;min-height:70px;margin-top:5px;border:2px dashed #1d1830;border-radius:10px;padding:8px;background:#fff}.muted{font-size:11px;color:#6a6278}
.busy{position:fixed;inset:0;z-index:50;background:#1c183980;display:grid;place-items:center;padding:16px}.busy-box{background:#fff;border:3px solid #1d1830;border-radius:20px;box-shadow:5px 6px 0 #1d1830;padding:20px 24px;max-width:420px;text-align:center;line-height:1.7}.busy-box small{display:block;color:#5c556b;margin-top:6px}
.unsettled-mark{font-size:11px;border:2px solid #1d1830;background:#ffecb4;border-radius:99px;padding:3px 7px;font-weight:900;white-space:nowrap}

.card-top{display:flex;align-items:start;justify-content:space-between;gap:8px}
.client{font-size:13px;font-weight:950;line-height:1.4;overflow-wrap:anywhere}
.subject{font-size:12px;color:#645d72;margin:4px 0 11px;overflow-wrap:anywhere;display:block}
/* 金額の右にメモの先頭2行。メモの有無でカードの高さを変えない（高さを2行分に固定） */
.money-row{display:flex;align-items:flex-start;gap:10px;min-height:2.9em}
.amount{font-size:21px;letter-spacing:-.04em;font-weight:950;white-space:nowrap;flex-shrink:0;line-height:1.3}
.memo-excerpt{flex:1;min-width:0;font-size:11px;line-height:1.45;height:2.9em;color:#4c4560;white-space:pre-line;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere;border-left:2px dotted #cfc6d9;padding-left:8px}
.memo-excerpt:empty{border-left-color:transparent}
.card-bottom{border-top:2px dashed #d8d1e2;margin-top:10px;padding-top:11px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:space-between;font-size:11px;font-weight:750}
.age{background:#ffe2e1;border:2px solid #1d1830;border-radius:99px;padding:4px 8px;font-size:11px;font-weight:900}
.age.high{background:#ff8b9a}.age.medium{background:#ffd569}
.date{font-weight:700;color:#665e76}
.status-chip{box-shadow:none;display:inline-flex;align-items:center;gap:5px;border-width:2px;padding:4px 9px;font-size:11px;font-weight:900;white-space:nowrap}
.status-chip:before{content:'';height:8px;width:8px;border-radius:50%;background:currentColor;border:1px solid #1d1830}
.status-untouched{background:#ffe0e4;color:#9d2848}.status-incoming{background:#ffe3a6;color:#755100}.status-contacted{background:#c6f4e7;color:#186754}
/* 詳細: 画面中央に重ねて開く（A-1） */
.overlay{position:fixed;inset:0;z-index:20;background:#1c1839a9;display:grid;place-items:center;padding:22px;overflow:auto}
.detail-panel{border:3px solid #1d1830;border-radius:24px;background:#fff;box-shadow:7px 8px 0 #1d1830;overflow:auto;max-width:960px;width:100%;max-height:calc(100vh - 44px)}
.detail-header{background:#e8e1ff;border-bottom:3px solid #1d1830;padding:20px 23px}
.detail-header-top{display:flex;align-items:start;justify-content:space-between;gap:10px}
.detail-header h2{font-size:22px;margin:6px 0 5px;line-height:1.35;overflow-wrap:anywhere}
.detail-header .subject{margin:0 0 14px}
.detail-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.detail-meta .amount{font-size:24px;margin-right:auto}
.detail-meta .pill{padding:5px 9px;box-shadow:none;font-size:11px;font-weight:850}
.detail-body{padding:22px}.detail-body h3{margin:0 0 10px;font-size:15px}
.status-choices{display:flex;flex-wrap:wrap;gap:9px}
.choice{border:2px solid #1d1830;border-radius:13px;padding:9px 11px;font-size:12px;font-weight:900;background:#fff;box-shadow:2px 3px 0 #1d1830}
.choice[aria-pressed=true]{background:#b7a4ff;box-shadow:inset 0 0 0 2px #fff,2px 3px 0 #1d1830}
.choice .dot{display:inline-block;width:9px;height:9px;background:#ff7182;border:1px solid #1d1830;border-radius:50%;margin-right:5px}
.choice[data-choice="連絡あり"] .dot{background:#ffd15a}.choice[data-choice="連絡済み"] .dot{background:#47d3aa}
.detail-columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;margin-top:23px}
.note-area{width:100%;min-height:220px;border:2px solid #1d1830;border-radius:15px;padding:12px;resize:vertical;line-height:1.65;background:#fffdf8}
.limit{text-align:right;color:#696176;font-size:11px;margin-top:4px}
.history{border:2px solid #1d1830;border-radius:15px;padding:0 13px;background:#faf8ff;max-height:300px;overflow:auto}
.history-item{padding:12px 0;border-bottom:1px dashed #cfc6d9;font-size:12px;line-height:1.55;overflow-wrap:anywhere}
.history-item:last-child{border-bottom:0}.history-item strong{display:block}
.history-item small{display:block;color:#706a7d;margin-bottom:3px}
.detail-actions{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-top:18px}
.feedback{font-weight:850;font-size:12px;color:#206f5d}
.notice{border:2px solid #1d1830;border-radius:16px;background:#ffecb4;padding:15px;margin:0 0 15px;font-weight:800;font-size:13px;line-height:1.6}
.notice.error{background:#ffe0e3}
.lost-memo{margin-top:10px;font-weight:500;font-size:12px}
.lost-memo textarea{width:100%;min-height:80px;margin-top:5px;border:2px dashed #1d1830;border-radius:10px;padding:8px;background:#fff}
.state-screen{border:3px solid #1d1830;background:#fff;border-radius:27px;box-shadow:7px 8px 0 #1d1830;min-height:340px;padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;margin-top:25px}
.state-screen .symbol{font-size:42px;background:#ffdf77;border:3px solid #1d1830;border-radius:20px;box-shadow:4px 5px 0 #1d1830;width:76px;height:76px;display:grid;place-items:center;margin-bottom:18px}
.state-screen h2{font-size:24px;margin:0 0 8px}
.state-screen p{max-width:480px;line-height:1.7;font-size:13px;color:#5c556b;margin:0 0 17px}
.identifier{border:2px dashed #1d1830;padding:9px 18px;background:#f5f1ff;font-weight:900;letter-spacing:.09em;overflow-wrap:anywhere;user-select:all}
.list-empty{min-height:250px;margin:0;grid-column:1/-1}
.spinner{animation:spin 1s linear infinite;display:inline-block}@keyframes spin{to{transform:rotate(360deg)}}
.banner{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;border:2px solid #1d1830;border-radius:14px;background:#fff;box-shadow:3px 4px 0 #1d1830;padding:10px 16px;font-size:13px;font-weight:800;max-width:calc(100vw - 32px)}
.banner.warn{background:#ffecb4}.banner.error{background:#ffe0e3}
.toast{bottom:70px}
.mock-panel{position:fixed;right:10px;top:10px;z-index:40;background:#e8e1ff;border:2px dashed #5d50ac;border-radius:12px;padding:8px 10px;font-size:11px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media(max-width:760px){
  .app{padding:16px 14px 55px}.topbar{display:block}.identity{margin-bottom:17px}h1{font-size:25px}
  .session{justify-content:flex-start}.email{width:100%;order:4}
  .summary{gap:8px}.stat{min-height:93px;padding:10px 9px;box-shadow:3px 4px 0 #1d1830;border-radius:15px}
  .stat .name{font-size:10px}.stat strong{font-size:17px;overflow-wrap:anywhere}
  .section-head{display:block}.section-head h2{font-size:19px}.tabs{margin-top:15px}
  .filters{gap:9px;padding:12px;box-shadow:3px 4px 0 #1d1830}.filters label{flex:1;min-width:125px}
  .filters .search{flex-basis:100%}.filters .hint{width:100%;margin:0}.control{width:100%}
  .list{grid-template-columns:1fr}.lane{min-height:auto}
  .overlay{padding:8px;place-items:stretch}.detail-panel{max-height:calc(100dvh - 16px)}
  .detail-columns{grid-template-columns:1fr}.detail-header{padding:16px}.detail-body{padding:16px}.state-screen{padding:22px}
}
@media(max-width:390px){.stat strong{font-size:15px}.button.small{padding:6px 8px}.session{gap:7px}.section-head h2{font-size:18px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="identity"><span class="mascot" aria-hidden="true"><i></i><i></i></span>
      <div><p class="eyebrow">RECEIVABLES / 見逃さず、次へ</p><h1>売掛ウォッチ <span style="color:#6756ef">●</span></h1><p class="subtitle">連絡状況ごとに、請求を見渡す</p></div>
    </div>
    <div class="session" id="session" hidden>
      <label for="staff">担当</label><select class="control" id="staff" aria-label="担当者"></select>
      <span class="email" id="who"></span>
      <button type="button" class="button small ghost" data-signout>サインアウト</button>
    </div>
  </header>

  <div id="special"></div>

  <main id="main" hidden>
    <section class="summary" aria-label="現在の表示条件の集計">
      <div class="stat"><span class="name">表示中の請求</span><strong id="stat-count"></strong></div>
      <div class="stat"><span class="name">表示分の請求額</span><strong id="stat-total"></strong></div>
      <div class="stat"><span class="name">未連絡（表示分）</span><strong id="stat-untouched"></strong></div>
    </section>
    <div class="section-head">
      <div><h2>請求を確認する</h2><p>連絡状況とメモを、請求ごとに記録できます。<span id="drag-hint"></span></p></div>
      <div class="tabs" role="tablist" aria-label="請求の種類">
        <button class="tab" role="tab" type="button" data-tab="未入金" aria-selected="true">未入金 <b id="count-unpaid">0</b></button>
        <button class="tab" role="tab" type="button" data-tab="未設定" aria-selected="false">未設定 <b id="count-unset">0</b></button>
      </div>
    </div>
    <div class="filters">
      <label>経過日数<select class="control" id="days"><option value="0">すべて（期日前を含む）</option><option value="30" selected>30日以上</option><option value="60">60日以上</option><option value="90">90日以上</option></select></label>
      <label class="search">取引先名・件名・請求番号・メモを検索<input class="control" id="search" type="search" placeholder="例：サンプル" autocomplete="off"></label>
      <label>並び順<select class="control" id="sort"><option value="age">経過日数の多い順</option><option value="amount">請求額の多い順</option><option value="client">取引先名順</option></select></label>
      <button type="button" class="button small ghost" data-refresh id="refresh">↻ 更新</button>
      <span class="hint">最終取得：<span id="last-fetch">—</span></span>
    </div>
    <div id="warnings"></div>
    <div id="attention"></div>
    <div class="content-title"><h2>連絡状況別のレーン</h2><span><span id="filter-description"></span> · <span id="shown-count"></span></span></div>
    <div class="list" id="list"></div>
  </main>
</div>

<div id="detail"></div>
<div id="busy" class="busy" role="alertdialog" aria-modal="true" aria-labelledby="busy-text" tabindex="-1" hidden><div class="busy-box"><span class="spinner" aria-hidden="true">◌</span> <strong id="busy-text"></strong><small>終わるまで、ほかの操作はできません（長くても30秒ほど）。</small></div></div>
<div id="slow" class="banner warn" role="status" hidden>応答を待っています…（最大15秒）</div>
<div id="toast" class="banner toast" role="status" hidden></div>

<script>
(function () {
  'use strict';
  var C = window.AR_CONFIG;
  var V = window.ArView;
  var MOCK = new URLSearchParams(location.search).get('mock') === '1';
  var $ = function (s) { return document.querySelector(s); };
  var esc = function (v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var has = function (o, k) { return Object.prototype.hasOwnProperty.call(o, k); };

  // ---- 状態 ----
  // ★ 書き込み（保存・移動・確定）は同時に1つだけ。書き込みの間は画面全体を止める（S.busy）。
  //   書き込みは、ほかの通信が1本も走っていないときにだけ始める（exclusive）。
  //   これで、書き込みと並んで走る通信の組み合わせを無くす（計画 §6-15、案B。W5 第1〜3巡の指摘の根）
  var S = {
    token: null, user: null,
    screen: 'signin',     // signin / config / loading / error / denied / main
    screenMessage: '', deniedSub: '',
    tabs: null, fetchedAt: '', warnings: [], listBusy: false,
    tab: '未入金', days: 30, query: '', sort: 'age',
    openId: null, openPartner: '', detailGen: 0,
    detail: null,         // { loading, records, error }
    draftStatus: null, draftMemo: null,
    notice: null,         // { kind: saved|info|conflict|paid|unknown|error, text, done }。★ 保存されなかったメモは知らせに持たせない（下の lost・unsettled が正本。W5 第4巡 指摘2）
    busy: null,           // 書き込み中: { text }。この間は画面全体を止める
    unsettled: {},        // 応答が分からなかった保存・移動: 請求ID → { opId, kind: save|drag, lostMemo, partner, to }。確定するまでその請求を操作させない
    lost: {},             // 保存されなかったメモの控え: 請求ID → { partner, items: [{ text, memo }] }。請求ごとに複数件（続けて失敗しても上書きしない）。
                          // 1件ずつ「消す」か、同じ内容の保存が成功するまで残す。一覧から消えても「要確認」から取り出せる（ar-view.js の addLost など）
    inflight: 0
  };
  var canDrag = window.matchMedia('(pointer: fine)').matches && !window.matchMedia('(any-pointer: coarse)').matches;
  function locked(id) { return has(S.unsettled, id); }

  // 操作ID（保存・移動のたびに作る。サーバが記録行に残し、「確定して」で照らし合わせる）
  function newOpId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    var b = new Uint8Array(16);
    crypto.getRandomValues(b);
    return Array.prototype.map.call(b, function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
  }

  // ---- 通信（計画 §3-5。URLSearchParams の payload でプリフライトを起こさない） ----
  var slowTimer = null;
  function beginWait() {
    S.inflight++;
    if (!slowTimer) slowTimer = setTimeout(function () { $('#slow').hidden = false; }, C.SLOW_NOTICE_MS);
  }
  function endWait() {
    S.inflight = Math.max(0, S.inflight - 1);
    if (!S.inflight) { clearTimeout(slowTimer); slowTimer = null; $('#slow').hidden = true; }
  }
  async function api(action, extra) {
    var payload = Object.assign({ action: action, idToken: S.token }, extra || {});
    beginWait();
    try {
      if (MOCK) return V.classifyResponse(await window.AR_MOCK_API(payload));
      var ctrl = new AbortController();
      var timer = setTimeout(function () { ctrl.abort(); }, C.TIMEOUT_MS);
      try {
        var res = await fetch(C.GAS_URL, { method: 'POST', body: new URLSearchParams({ payload: JSON.stringify(payload) }), signal: ctrl.signal });
        return V.classifyResponse({ text: await res.text() });
      } catch (e) {
        return V.classifyResponse(e && e.name === 'AbortError' ? { aborted: true } : { networkError: true });
      } finally {
        clearTimeout(timer);
      }
    } finally {
      endWait();
    }
  }

  // 書き込みを1つだけ走らせる。ほかの通信が走っていれば始めない。走っている間は画面全体を止める
  async function exclusive(text, fn) {
    if (S.busy || S.inflight > 0 || S.listBusy) {
      toast('読み込みの途中です。終わってから、もう一度操作してください。', 'error');
      return false;
    }
    S.busy = { text: text };
    if (S.openId) renderDetail();      // メモ欄・連絡状況・保存を先に押せない状態にしてから覆う
    renderBusy();
    try {
      await fn();
    } finally {
      S.busy = null;
      renderBusy();
      if (S.screen === 'main') renderMain();
      if (S.openId) renderDetail();
    }
    return true;
  }
  // 書き込みの間は、背後（一覧・詳細）を inert にして、Tab・文字入力・クリックを実際に届かなくする（W5 第4巡 指摘1）。
  // 覆い（#busy）は背後の外に置いてあるので inert にならない
  function renderBusy() {
    var on = !!S.busy;
    ['.app', '#detail'].forEach(function (sel) { var el = $(sel); if (on) el.setAttribute('inert', ''); else el.removeAttribute('inert'); });
    $('#busy').hidden = !on;
    $('#busy-text').textContent = on ? S.busy.text : '';
    if (on) $('#busy').focus();
  }

  // どの操作でも共通: サインイン切れ・許可なし は画面ごと切り替える。切り替えたら true
  function handleAuthFailure(r) {
    if (r.kind !== 'fail') return false;
    if (r.code === 'UNAUTHENTICATED') {
      S.token = null;
      clearShownData();
      showScreen('signin', 'サインインの期限が切れました。もう一度サインインしてください。');
      return true;
    }
    if (r.code === 'FORBIDDEN') {
      S.token = null;
      S.deniedSub = r.json.sub || '';
      clearShownData();
      showScreen('denied');
      return true;
    }
    return false;
  }

  // 拒否・サインイン切れのときに、前に読み込んでいた請求の内容を画面から消す（W6 で見つかった不具合。計画 §6-20）。
  // 詳細は書き込みの途中（S.busy）でも閉じる。保存されなかったメモの控え（S.lost）と未確定の操作（S.unsettled）は
  // 本人のものなので消さない（サインインし直せば要確認に戻る）
  function clearShownData() {
    S.openId = null; S.detail = null; S.notice = null; S.draftStatus = null; S.draftMemo = null;
    S.detailGen++;
    S.tabs = null; S.fetchedAt = ''; S.warnings = [];
    $('#detail').innerHTML = '';
    $('#list').innerHTML = '';
    $('#attention').innerHTML = '';
    $('#warnings').innerHTML = '';
    ['#stat-count', '#stat-total', '#stat-untouched', '#count-unpaid', '#count-unset', '#shown-count', '#last-fetch'].forEach(function (sel) { $(sel).textContent = ''; });
    document.body.style.overflow = '';
  }

  // ---- サインイン（Google Identity Services） ----
  function onCredential(resp) {
    S.token = resp.credential;
    start();
  }
  function renderGoogleButton() {
    var slot = document.getElementById('gsi-slot');
    if (!slot) return;
    if (MOCK) {
      slot.innerHTML = '<button type="button" class="button primary" data-mock-signin>（作り物）サインイン</button>';
      return;
    }
    var tries = 0;
    (function wait() {
      if (window.google && google.accounts && google.accounts.id) {
        google.accounts.id.initialize({ client_id: C.GOOGLE_CLIENT_ID, callback: onCredential, auto_select: true, use_fedcm_for_prompt: true });
        google.accounts.id.renderButton(slot, { theme: 'outline', size: 'large', text: 'signin_with' });
        google.accounts.id.prompt();
      } else if (tries++ < 50) {
        setTimeout(wait, 200);
      } else {
        slot.textContent = 'Google のサインイン部品を読み込めませんでした。ページを読み込み直してください。';
      }
    })();
  }
  function signOut() {
    if (!MOCK && window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
    S.token = null; S.user = null; S.tabs = null; closeDetail(true);
    showScreen('signin', 'サインアウトしました。');
  }

  // ---- 起動と一覧 ----
  async function start() {
    showScreen('loading');
    var r = await api('bootstrap');
    if (handleAuthFailure(r)) return;
    if (r.kind !== 'ok') { showScreen('error', V.failureText(r.kind, r.code)); return; }
    S.user = r.json.user;
    $('#who').textContent = S.user.email;
    $('#staff').innerHTML = (r.json.staffOptions || ['全社']).map(function (o) { return '<option>' + esc(o) + '</option>'; }).join('') +
      '<option disabled>担当者A（準備中）</option><option disabled>担当者B（準備中）</option>';
    if (r.json.defaults && typeof r.json.defaults.minDays === 'number') { S.days = r.json.defaults.minDays; $('#days').value = String(S.days); }
    await loadList();
  }

  // 一覧を取る。読むだけなので、壊れた応答・打ち切り・通信の失敗は1回だけ自動で取り直す（W1 で分かったこと1）
  async function loadList() {
    if (S.listBusy) return;
    S.listBusy = true;
    $('#refresh').disabled = true;
    if (!S.tabs) showScreen('loading');
    try {
      var r = await api('list');
      if (r.kind === 'broken' || r.kind === 'timeout' || r.kind === 'network') r = await api('list');
      if (handleAuthFailure(r)) return;
      if (r.kind !== 'ok') {
        var why = r.kind === 'fail' && r.code === 'MF_PAGE_LIMIT' ? '件数が上限（1,000件）を超えたため、一部だけを表示することはしません。管理者に連絡してください。' : V.failureText(r.kind, r.code);
        if (S.tabs) toast('一覧を取り直せませんでした: ' + why + '（前回の内容を表示しています）', 'error');
        else showScreen('error', why);
        return;
      }
      S.tabs = r.json.tabs;
      S.fetchedAt = r.json.fetchedAt;
      S.warnings = r.json.warnings || [];
      // ★ 未確定（unsettled）・保存されなかったメモ（lost）は取り直しでは外さない。一覧から消えても「要確認」に残る
      if (S.openId && !findCard(S.openId)) {
        closeDetail(true);
        toast('開いていた請求は入金済みになり、一覧から消えました。');
      }
      showScreen('main');
    } finally {
      S.listBusy = false;
      $('#refresh').disabled = false;
    }
  }

  function allCards() { return S.tabs ? S.tabs['未入金'].concat(S.tabs['未設定']) : []; }
  function findCard(id) { return allCards().filter(function (c) { return c.billingId === id; })[0] || null; }
  function tabOf(card) { return S.tabs && S.tabs['未設定'].indexOf(card) >= 0 ? '未設定' : '未入金'; }

  // ---- 画面の切り替え ----
  function showScreen(name, message) {
    S.screen = name;
    S.screenMessage = message || '';
    var main = name === 'main';
    $('#main').hidden = !main;
    $('#session').hidden = !(main || name === 'loading' || name === 'error') || !S.user;
    $('#special').innerHTML = main ? '' : stateScreen();
    if (name === 'signin') renderGoogleButton();
    if (main) renderMain();
  }

  function stateScreen() {
    var screens = {
      signin: ['✦', 'サインイン', S.screenMessage || '許可されたメンバーが利用できます。Google アカウントでサインインしてください。', '<div id="gsi-slot"></div>'],
      config: ['!', '接続先が設定されていません', 'この画面の接続先（config.js の GAS_URL）がまだ空です。管理者に連絡してください。', ''],
      loading: ['◌', '請求を読み込み中', '一覧を取得しています。少々お待ちください。', '<span class="spinner" aria-label="読み込み中">◌</span>'],
      error: ['!', '一覧を取得できませんでした', esc(S.screenMessage) + '。通信状態を確認して、もう一度お試しください。', '<button type="button" class="button primary" data-retry>再試行</button>'],
      denied: ['×', 'アクセスできません', 'このアカウントは利用を許可されていません。管理者に次の識別子を伝えてください。',
        '<div class="identifier">' + esc(S.deniedSub || '（識別子を受け取れませんでした）') + '</div><p style="margin-top:14px"><button type="button" class="button small ghost" data-signout>別のアカウントでサインイン</button></p>']
    };
    var s = screens[S.screen];
    var desc = S.screen === 'signin' ? esc(s[2]) : s[2];
    return '<div class="state-screen"><span class="symbol" aria-hidden="true">' + s[0] + '</span><h2>' + s[1] + '</h2><p>' + desc + '</p>' + s[3] + '</div>';
  }

  // ---- 一覧の描画（検索欄などの入力部品は描き直さない。入力中のフォーカスを保つため） ----
  function visibleCards() {
    return V.sortCards(V.filterCards(S.tabs[S.tab], { days: S.days, query: S.query }), S.sort);
  }

  function renderMain() {
    if (!S.tabs) return;
    var data = visibleCards();
    var sum = V.summarize(data);
    $('#count-unpaid').textContent = S.tabs['未入金'].length;
    $('#count-unset').textContent = S.tabs['未設定'].length;
    $('#stat-count').textContent = sum.count + '件';
    $('#stat-total').textContent = V.yen(sum.total);
    $('#stat-untouched').textContent = sum.untouched + '件';
    $('#shown-count').textContent = data.length + '件を表示';
    $('#filter-description').textContent = S.days > 0 ? (S.tab === '未入金' ? '支払期限から' : '作成日から') + S.days + '日以上' : 'すべて（期日前を含む）';
    $('#last-fetch').textContent = S.fetchedAt ? S.fetchedAt + ' 取得' : '—';
    $('#drag-hint').textContent = canDrag ? ' カードをレーンへドラッグしても連絡状況を変えられます。' : '';
    $('#warnings').innerHTML = S.warnings.length ? '<div class="notice">' + S.warnings.map(esc).join('<br>') + '</div>' : '';
    document.querySelectorAll('[data-tab]').forEach(function (x) { x.setAttribute('aria-selected', String(x.dataset.tab === S.tab)); });
    $('#list').innerHTML = listHTML(data);
    renderAttention();
  }

  // 「要確認」: 確定できていない操作と、保存されなかったメモ。一覧とは別に置く（請求が一覧から消えても取り出せる。W5 第3巡 指摘2）
  function renderAttention() {
    var items = V.attentionItems(S.unsettled, S.lost);
    $('#attention').innerHTML = !items.length ? '' :
      '<section class="attention" aria-label="要確認"><h3>要確認（' + items.length + '件）</h3>' + items.map(function (it) {
        var open = findCard(it.id) ? '<button type="button" class="button small ghost" data-open="' + esc(it.id) + '">詳細を開く</button>' : '<span class="muted">一覧にはありません（入金済みなど）</span>';
        var act = it.kind === 'unsettled'
          ? '<button type="button" class="button small primary" data-settle-id="' + esc(it.id) + '">保存できたかを確かめる</button>'
          : '<button type="button" class="button small ghost" data-dismiss-lost="' + esc(it.id) + '" data-idx="' + it.idx + '">この控えを消す</button>';
        var memo = it.memo !== null && it.memo !== undefined && it.memo !== ''
          ? '<details><summary>書いたメモを見る</summary><textarea readonly>' + esc(it.memo) + '</textarea></details>' : '';
        return '<div class="attention-item"><strong>' + esc(it.partner) + '</strong> — ' + esc(it.text) + '<div class="attention-actions">' + act + open + '</div>' + memo + '</div>';
      }).join('') + '</section>';
  }

  function statusClass(s) { return { 'ノータッチ': 'untouched', '連絡あり': 'incoming', '連絡済み': 'contacted' }[s] || 'untouched'; }
  function statusBadge(s) { return '<span class="status-chip status-' + statusClass(s) + '">' + esc(s) + '</span>'; }
  function dateLabel(tab) { return tab === '未入金' ? '支払期日' : '作成日'; }
  function dateOf(card, tab) { return tab === '未入金' ? card.dueDate : card.createdAt; }

  function cardHTML(c) {
    var unsettled = locked(c.billingId);
    var drag = canDrag && !unsettled ? ' draggable="true"' : '';
    return '<button type="button" class="invoice-card' + (S.openId === c.billingId ? ' is-active' : '') + (unsettled ? ' is-pending' : '') + '"' + drag +
      ' data-open="' + esc(c.billingId) + '" aria-label="' + esc(c.partner) + ' ' + esc(c.title) + ' ' + V.yen(c.amount) + ' ' + esc(c.status) + (unsettled ? ' 未確定' : '') + ' 詳細を開く">' +
      '<span class="card-top"><span><span class="client">' + esc(c.partner) + '</span><span class="subject">' + esc(c.title) + '</span></span>' +
      (unsettled ? '<span class="unsettled-mark">未確定</span>' : '') + '</span>' +
      '<span class="money-row"><span class="amount">' + V.yen(c.amount) + '</span><span class="memo-excerpt" title="メモの先頭2行">' + esc(V.memoExcerpt(c.memo)) + '</span></span>' +
      '<span class="card-bottom"><span class="date">' + dateLabel(S.tab) + ' ' + V.jpDate(dateOf(c, S.tab)) + '</span>' +
      '<span class="age ' + V.ageClass(c.days) + '">' + V.ageLabel(S.tab, c.days) + '</span>' + statusBadge(c.status) + '</span></button>';
  }

  function listHTML(data) {
    if (!data.length) return '<div class="state-screen list-empty"><span class="symbol" aria-hidden="true">✓</span><h2>条件に合う請求はありません</h2><p>経過日数や検索の条件を変えて確認してください。</p></div>';
    return V.STATUSES.map(function (status) {
      var items = data.filter(function (x) { return x.status === status; });
      return '<section class="lane" data-lane="' + status + '" aria-label="' + status + '"><div class="lane-head"><span>' + status + '</span><b>' + items.length + '件</b></div>' +
        '<div class="lane-stack">' + (items.map(cardHTML).join('') || '<div class="lane-empty">該当なし</div>') + '</div></section>';
    }).join('');
  }

  // ---- 詳細（中央に重ねて開く。A-1） ----
  // 詳細の読み込みには世代番号を付け、開き直し・読み直しの後に届いた古い応答は捨てる（W5 第3巡 指摘1）
  async function openDetail(id) {
    var card = findCard(id);
    if (!card || S.busy) return;
    S.openId = id; S.openPartner = card.partner; S.draftStatus = null; S.draftMemo = null; S.notice = null;
    S.detail = { loading: true, records: [] };
    var gen = ++S.detailGen;
    renderDetail(true);
    renderMain();
    // 前の保存・移動が未確定なら、記録を読む代わりに確定を頼む（確定の答えに記録も入っている）
    if (has(S.unsettled, id)) {
      S.notice = { kind: 'unknown', text: '前の操作が保存できたかを確かめています…' };
      renderDetail();
      if (!(await runSettle(id))) {
        // 読み込みの途中などで始められなかった
        S.detail = { loading: false, records: [] };
        S.notice = { kind: 'unknown', done: 'failed',
          text: '前の操作が保存できたかを、まだ確かめられていません。「もう一度確かめる」を押してください。確かめるまで、この請求は保存も移動もできません。' };
        renderDetail();
      }
      return;
    }
    await fetchDetail(id, gen);
  }

  // 記録を取り直す。世代が変わっていれば捨てる。記録の先頭が一覧の値より新しければ、一覧のカードもそれに合わせる
  async function fetchDetail(id, gen) {
    var r = await api('detail', { billingId: id });
    if (S.openId !== id || gen !== S.detailGen) return false;
    if (handleAuthFailure(r)) return false;
    if (r.kind !== 'ok') { S.detail = { loading: false, records: S.detail ? S.detail.records : [], error: V.failureText(r.kind, r.code) }; renderDetail(); return false; }
    var recs = r.json.records || [];
    var card = findCard(id);
    if (card && recs.length && recs[0].recordId !== card.lastRecordId) {
      card.status = recs[0].status; card.memo = recs[0].memo; card.lastRecordId = recs[0].recordId;
      renderMain();
    }
    S.detail = { loading: false, records: recs };
    renderDetail();
    return true;
  }

  function hasDraft(card) {
    return !!card && V.buildUpdate(card, S.draftStatus, S.draftMemo) !== null;
  }

  function closeDetail(force) {
    if (S.busy) return;                // 書き込みの間は閉じさせない
    var id = S.openId;
    var card = findCard(id);
    if (!force && !locked(id) && hasDraft(card) && !window.confirm('保存していない変更があります。閉じてよいですか？')) return;
    // 保存されなかったメモは S.lost・S.unsettled が持っているので、閉じても要確認に残る（知らせには持たせていない）
    S.openId = null; S.detail = null; S.notice = null; S.draftStatus = null; S.draftMemo = null;
    S.detailGen++;
    $('#detail').innerHTML = '';
    document.body.style.overflow = '';
    if (S.tabs && S.screen === 'main') renderMain();
    // 一覧は描き直しているので、開いたカードを請求IDで探し直してフォーカスを戻す
    var back = id ? document.querySelector('.invoice-card[data-open="' + CSS.escape(id) + '"]') : null;
    if (back) back.focus();
  }

  function renderDetail(focus) {
    var card = findCard(S.openId);
    if (!card) { $('#detail').innerHTML = ''; return; }
    var tab = tabOf(card);
    var memoEl = document.getElementById('memo');
    var keepCaret = memoEl && document.activeElement === memoEl ? [memoEl.selectionStart, memoEl.selectionEnd] : null;
    // 描き直すと中の部品が作り直されるので、詳細の中にあったフォーカスを失わないように覚えておく
    var hadFocus = $('#detail').contains(document.activeElement);
    var current = S.draftStatus !== null ? S.draftStatus : card.status;
    var memo = S.draftMemo !== null ? S.draftMemo : card.memo;
    // 未確定の操作がある間は操作させない。読み直し中・衝突・入金済みも、読み直すまで保存させない
    var busy = !!S.busy || locked(S.openId) ||
      (S.notice && ((S.notice.kind === 'unknown' && S.notice.done !== 'ok') || S.notice.kind === 'conflict' || S.notice.kind === 'paid'));
    var choices = V.STATUSES.map(function (s) {
      return '<button type="button" class="choice" data-choice="' + s + '" aria-pressed="' + (current === s) + '"' + (busy ? ' disabled' : '') + '><span class="dot"></span>' + s + '</button>';
    }).join('');
    var d = S.detail || { loading: true, records: [] };
    var hist = d.loading ? '<div class="history-item">読み込み中…</div>'
      : (V.historyLines(d.records).map(function (h) { return '<div class="history-item"><small>' + esc(h.when) + ' ・ ' + esc(h.who) + '</small><strong>' + esc(h.content) + '</strong></div>'; }).join('') || '<div class="history-item">記録はまだありません</div>');
    if (d.error) hist = '<div class="history-item">記録を読めませんでした（' + esc(d.error) + '）。<button type="button" class="button small ghost" data-reload-detail>読み直す</button></div>' + hist;
    $('#detail').innerHTML =
      '<div class="overlay" data-overlay><article class="detail-panel" role="dialog" aria-modal="true" aria-labelledby="detail-title" tabindex="-1">' +
      '<header class="detail-header"><div class="detail-header-top"><span class="eyebrow">請求の詳細 · 請求番号 ' + esc(card.billingNumber) + '</span>' +
      '<button class="button small ghost" type="button" data-close>✕ 閉じる</button></div>' +
      '<h2 id="detail-title">' + esc(card.partner) + '</h2><div class="subject">' + esc(card.title) + '</div>' +
      '<div class="detail-meta"><strong class="amount">' + V.yen(card.amount) + '</strong><span class="pill">' + dateLabel(tab) + ' ' + V.jpDate(dateOf(card, tab)) + '</span>' +
      '<span class="pill">' + V.ageLabel(tab, card.days) + '</span>' + statusBadge(card.status) + '</div></header>' +
      '<div class="detail-body">' + noticeHTML() + lostBoxHTML() +
      '<h3>連絡状況を選ぶ</h3><div class="status-choices" role="group" aria-label="連絡状況">' + choices + '</div>' +
      '<div class="detail-columns"><section><h3>メモ <small style="font-weight:500">（上書き）</small></h3>' +
      '<textarea class="note-area" id="memo" maxlength="5000" placeholder="先方への連絡内容や次の予定を記入"' + (busy ? ' disabled' : '') + '>' + esc(memo) + '</textarea>' +
      '<div class="limit" id="limit">' + memo.length + ' / 5,000文字</div></section>' +
      '<section><h3>記録（新しい順）</h3><div class="history">' + hist + '</div></section></div>' +
      '<div class="detail-actions"><button type="button" class="button teal" data-save' + (busy || d.loading ? ' disabled' : '') + '>変更をまとめて保存</button>' +
      '<span class="feedback" role="status">' + (S.notice && (S.notice.kind === 'saved' || S.notice.kind === 'info') ? esc(S.notice.text) : '') + '</span></div>' +
      '</div></article></div>';
    document.body.style.overflow = 'hidden';
    if (S.busy) return;                // 書き込み中はフォーカスを「保存中」の覆いに置いたままにする
    var m = document.getElementById('memo');
    if (keepCaret && m && !m.disabled) { m.focus(); m.setSelectionRange(keepCaret[0], keepCaret[1]); }
    else if (focus || hadFocus) document.querySelector('.detail-panel').focus();
  }

  function noticeHTML() {
    var n = S.notice;
    if (!n || n.kind === 'saved' || n.kind === 'info') return '';
    var btn = '';
    if (n.kind === 'conflict') btn = '<br><button type="button" class="button small ghost" data-reload-detail style="margin-top:10px">最新の内容を表示</button>';
    if (n.kind === 'paid') btn = '<br><button type="button" class="button small ghost" data-reload-list style="margin-top:10px">一覧を取り直す</button>';
    if (n.kind === 'unknown' && n.done === 'failed') btn = locked(S.openId)
      ? '<br><button type="button" class="button small ghost" data-settle-id="' + esc(S.openId) + '" style="margin-top:10px">もう一度確かめる</button>'
      : '<br><button type="button" class="button small ghost" data-reload-detail style="margin-top:10px">もう一度読み直す</button>';
    return '<div class="notice' + (n.kind === 'error' || n.kind === 'conflict' ? ' error' : '') + '" role="alert">' + esc(n.text) + btn + '</div>';
  }

  // 「保存されなかったメモ」欄。知らせとは別に、S.unsettled（確定前）と S.lost の控え（すべて）を表示する。
  // 連絡状況を選ぶ・読み直す・閉じるでは消えない。消えるのは「消す」を押したときと、同じ内容の保存が成功したときだけ
  function lostBoxHTML() {
    var id = S.openId;
    var out = '';
    var u = has(S.unsettled, id) ? S.unsettled[id] : null;
    if (u && u.lostMemo) {
      out += '<div class="notice lost-memo" role="note">あなたが書いたメモ（保存できたかを確かめています。必要ならコピーしてください）<textarea readonly>' + esc(u.lostMemo) + '</textarea></div>';
    }
    (has(S.lost, id) ? S.lost[id].items : []).forEach(function (it, idx) {
      out += '<div class="notice lost-memo" role="note">保存されなかったメモ' + (it.text ? '（' + esc(it.text) + '）' : '') +
        '。必要ならコピーして、メモ欄に貼り直してください<textarea readonly>' + esc(it.memo) + '</textarea>' +
        '<button type="button" class="button small ghost" data-dismiss-lost="' + esc(id) + '" data-idx="' + idx + '">この控えを消す</button></div>';
    });
    return out;
  }

  // 保存（計画 §3-5）。1回の保存＝変わった項目だけを1回送る。書き込みの間は画面全体を止める（詳細も閉じられない）
  function save() {
    var id = S.openId;
    var card = findCard(id);
    if (!card || locked(id)) return;
    var body = V.buildUpdate(card, S.draftStatus, S.draftMemo);
    if (!body) { S.notice = { kind: 'info', text: '変更はありません' }; renderDetail(); return; }
    body.opId = newOpId();
    exclusive('保存しています…', function () { return saveInner(id, body); });
  }

  async function saveInner(id, body) {
    var lostMemo = body.memo !== undefined ? body.memo : null;
    S.notice = null;
    var r = await api('update', body);
    var card = findCard(id);
    if (handleAuthFailure(r)) return;
    if (r.kind === 'ok') {
      if (card) applyState(card, r.json.state);
      // 保存されなかったメモと同じ内容が保存できたら、控えは役目を終えた
      V.removeLostMemo(S.lost, id, r.json.state.memo);
      if (!r.json.unchanged && S.detail && S.openId === id &&
        !S.detail.records.some(function (x) { return x.recordId === r.json.state.lastRecordId; })) {
        S.detail.records.unshift({ recordId: r.json.state.lastRecordId, at: r.json.state.at, status: r.json.state.status, memo: r.json.state.memo,
          statusChanged: body.status !== undefined, memoChanged: body.memo !== undefined, email: S.user ? S.user.email : '' });
      }
      S.draftStatus = null; S.draftMemo = null;
      S.notice = { kind: r.json.unchanged ? 'info' : 'saved', text: r.json.unchanged ? '変更はありません' : '✓ 保存しました' };
      return;
    }
    if (r.kind === 'fail') {
      var kind = r.code === 'CONFLICT' ? 'conflict' : (r.code === 'PAID_OR_OUT_OF_SCOPE' || r.code === 'NOT_FOUND') ? 'paid' : 'error';
      V.addLost(S.lost, id, card ? card.partner : S.openPartner, V.failureText(r.kind, r.code), lostMemo);   // 先の控えは上書きしない
      S.notice = {
        kind: kind,
        text: kind === 'conflict' ? 'ほかの人が先に更新しました。あなたの変更は保存していません。最新の内容を表示し直してから、もう一度操作してください。'
          : kind === 'paid' ? V.failureText(r.kind, r.code) + '。保存はしていません。一覧を取り直してください。'
            : V.failureText(r.kind, r.code) + '。保存はしていません。もう一度お試しください。'
      };
      return;
    }
    // 壊れた応答・打ち切り・通信の失敗: 書けたかどうか分からない。送り直さず、その操作IDの確定を頼む（G12 ④・§6-13）
    S.unsettled[id] = { opId: body.opId, kind: 'save', lostMemo: lostMemo, partner: card ? card.partner : S.openPartner };
    S.draftStatus = null; S.draftMemo = null;
    S.busy = { text: '保存できたかを確かめています…' };
    renderBusy();
    await settleInner(id);
  }

  // 未確定の操作の「確定」を、書き込みとして1つだけ走らせる
  function runSettle(id) {
    return exclusive('保存できたかを確かめています…', function () { return settleInner(id); });
  }

  // 未確定の操作の「確定」を頼む（§6-13）。サーバはロックの中で、その操作IDの記録があれば written、
  // 無ければ取り消しの印を付けて cancelled を返す。どちらでも、その後にその操作が書かれることは無い。
  // 答えを受け取れなければ未確定のまま残し、その請求を操作させない（要確認から、いつでも確かめ直せる）
  async function settleInner(id) {
    var u = S.unsettled[id];
    if (!u) return;
    var r = await api('detail', { billingId: id, settleOpId: u.opId });
    if (handleAuthFailure(r)) return;
    var card = findCard(id);
    var open = S.openId === id;
    if (r.kind !== 'ok' || !r.json.settled) {
      var why = r.kind === 'ok' ? '答えを読めませんでした' : V.failureText(r.kind, r.code);
      if (open) {
        S.detail = { loading: false, records: S.detail ? S.detail.records : [] };
        S.notice = { kind: 'unknown', done: 'failed',
          text: '前の操作が保存できたかを、まだ確かめられていません（' + why + '）。「もう一度確かめる」を押してください。確かめるまで、この請求は保存も移動もできません。' };
      } else {
        toast('「' + u.partner + '」の操作が保存できたかを確かめられませんでした（' + why + '）。画面上の「要確認」から確かめてください。', 'error');
      }
      return;
    }
    delete S.unsettled[id];
    if (card) applyState(card, r.json.state);
    var written = r.json.settled === 'written';
    // 保存できていたなら、通常の保存成功と同じく、保存後のメモと同じ内容の控えだけを外す（差分確認 第2巡 条件）
    if (written && r.json.state) V.removeLostMemo(S.lost, id, r.json.state.memo);
    if (open) {
      S.detailGen++;                   // 確定の答え（記録つき）を正とする。これより前に始めた読み込みの応答は捨てる
      S.detail = { loading: false, records: r.json.records || [] };
      S.notice = written
        ? { kind: 'saved', text: '✓ 保存できていました（記録の先頭）' }
        : { kind: 'unknown', done: 'ok',
          text: '保存されていませんでした。この操作は取り消したので、あとから書かれることはありません。最新の内容を表示しています。必要ならもう一度操作してください。' };
    }
    if (!written) V.addLost(S.lost, id, u.partner, '保存はできていませんでした（取り消しました）', u.lostMemo);
    if (u.kind === 'drag' || !open) {
      toast(written ? '「' + u.partner + '」の' + (u.kind === 'drag' ? ' ' + u.to + ' への移動' : '保存') + 'はできていました'
        : '「' + u.partner + '」の' + (u.kind === 'drag' ? '移動' : '保存') + 'はできていませんでした（取り消しました）。最新の状態で表示しています。', written ? '' : 'error');
    }
  }

  // 「最新の内容を表示」「読み直す」。書きかけのメモは知らせの中に残す（消さない）。読み直すまで保存させない
  async function reloadDetail() {
    if (S.busy) return;
    var id = S.openId;
    var gen = ++S.detailGen;
    S.draftStatus = null; S.draftMemo = null;
    S.notice = { kind: 'unknown', text: '最新の内容を読み直しています…' };
    renderDetail();
    var ok = await fetchDetail(id, gen);
    if (S.openId !== id || gen !== S.detailGen) return;
    S.notice = ok
      ? { kind: 'info', text: has(S.lost, id) ? '最新の内容を表示しました（あなたが書いたメモは「保存されなかったメモ」に残しています）' : '最新の内容を表示しました' }
      : { kind: 'unknown', done: 'failed', text: '最新の状態を読み直せませんでした。「もう一度読み直す」を押してください。読み直すまで保存はできません。' };
    renderDetail();
  }

  function applyState(card, st) {
    if (!st) return;
    card.status = st.status; card.memo = st.memo; card.lastRecordId = st.lastRecordId;
  }

  // ---- ドラッグ＆ドロップ（パソコンだけ。§3-5）。書き込みなので、保存と同じく1つだけ・画面を止める ----
  function moveByDrag(id, toStatus) {
    var card = findCard(id);
    if (!card || card.status === toStatus || locked(id)) return;
    exclusive('移動しています…', function () { return moveInner(id, toStatus); });
  }

  async function moveInner(id, toStatus) {
    var card = findCard(id);
    var from = card.status;
    var opId = newOpId();
    card.status = toStatus;            // 落とした時点で移しておく
    renderMain();
    var r = await api('update', { billingId: id, status: toStatus, baseRecordId: card.lastRecordId || 0, opId: opId });
    card = findCard(id) || card;
    if (handleAuthFailure(r)) return;
    if (r.kind === 'ok') {
      applyState(card, r.json.state);
      toast('「' + card.partner + '」を ' + toStatus + ' へ移しました');
      return;
    }
    if (r.kind !== 'fail') {
      // 書けたかどうか分からない（G12 ④）。未確定にして確定を頼む。一覧の取り直しでは外さない
      S.unsettled[id] = { opId: opId, kind: 'drag', partner: card.partner, to: toStatus };
      S.busy = { text: '移動できたかを確かめています…' };
      renderBusy();
      await settleInner(id);
      return;
    }
    card.status = from;                // 元のレーンへ戻す
    if (r.code === 'CONFLICT') applyState(card, r.json.state);
    if (r.code === 'PAID_OR_OUT_OF_SCOPE' || r.code === 'NOT_FOUND') {
      toast('移せませんでした: ' + V.failureText(r.kind, r.code) + '。一覧を取り直します。', 'error');
      await loadList();
      return;
    }
    toast('移せませんでした: ' + V.failureText(r.kind, r.code) + '。' +
      (r.code === 'CONFLICT' ? '最新の連絡状況で表示し直しました。' : '元のレーンへ戻しました。'), 'error');
  }

  // ---- 小さな知らせ ----
  var toastTimer = null;
  function toast(text, kind) {
    var el = $('#toast');
    el.textContent = text;
    el.className = 'banner toast' + (kind ? ' ' + kind : '');
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, kind === 'error' ? 8000 : 4000);
  }

  // ---- 操作の受け取り（書き込みの間は、どの操作も受け付けない） ----
  document.addEventListener('click', function (e) {
    if (S.busy) { e.preventDefault(); e.stopPropagation(); return; }
    if (e.target.matches && e.target.matches('[data-overlay]')) { closeDetail(false); return; }
    var b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.tab) { S.tab = b.dataset.tab; renderMain(); }
    else if (b.dataset.open) { if (S.openId) closeDetail(false); if (!S.openId) openDetail(b.dataset.open); }
    else if (b.hasAttribute('data-close')) closeDetail(false);
    else if (b.dataset.choice) { S.draftStatus = b.dataset.choice; S.notice = null; renderDetail(); }
    else if (b.hasAttribute('data-save')) save();
    else if (b.hasAttribute('data-refresh')) loadList();
    else if (b.hasAttribute('data-reload-list')) { closeDetail(true); loadList(); }
    else if (b.hasAttribute('data-reload-detail')) reloadDetail();
    else if (b.dataset.settleId) {
      var sid = b.dataset.settleId;
      if (S.openId === sid) { S.notice = { kind: 'unknown', text: '前の操作が保存できたかを確かめています…' }; renderDetail(); }
      runSettle(sid);
    }
    else if (b.dataset.dismissLost) { V.dismissLost(S.lost, b.dataset.dismissLost, Number(b.dataset.idx)); renderAttention(); if (S.openId) renderDetail(); }
    else if (b.hasAttribute('data-retry')) { if (S.user) loadList(); else start(); }
    else if (b.hasAttribute('data-signout')) signOut();
    else if (b.hasAttribute('data-mock-signin')) onCredential({ credential: 'mock' });
  }, true);

  document.addEventListener('input', function (e) {
    if (S.busy) return;                // 書き込みの間の入力は受け取らない（念のため）
    if (e.target.id === 'search') { S.query = e.target.value; renderMain(); }
    else if (e.target.id === 'memo') { S.draftMemo = e.target.value; $('#limit').textContent = e.target.value.length + ' / 5,000文字'; }
  });

  document.addEventListener('change', function (e) {
    if (e.target.id === 'days') { S.days = Number(e.target.value); renderMain(); }
    else if (e.target.id === 'sort') { S.sort = e.target.value; renderMain(); }
  });

  document.addEventListener('keydown', function (e) {
    // 書き込みの間はキーを一切通さない（Tab・文字入力を含む。inert が効かない古いブラウザへの備え）
    if (S.busy) { e.preventDefault(); e.stopPropagation(); return; }
    if (e.key === 'Escape' && S.openId) closeDetail(false);
  }, true);

  // ドラッグ（pointer が細かい端末だけ。draggable は cardHTML が付ける）
  document.addEventListener('dragstart', function (e) {
    var c = e.target.closest && e.target.closest('.invoice-card[draggable=true]');
    if (!c) return;
    if (S.busy || S.inflight > 0) { e.preventDefault(); toast('読み込みの途中です。終わってから、もう一度操作してください。', 'error'); return; }
    e.dataTransfer.setData('text/plain', c.dataset.open);
    e.dataTransfer.effectAllowed = 'move';
    c.classList.add('dragging');
  });
  document.addEventListener('dragend', function (e) {
    if (e.target.classList) e.target.classList.remove('dragging');
    document.querySelectorAll('.lane.drop-target').forEach(function (l) { l.classList.remove('drop-target'); });
  });
  document.addEventListener('dragover', function (e) {
    var lane = e.target.closest && e.target.closest('.lane');
    if (!lane) return;
    e.preventDefault();
    document.querySelectorAll('.lane.drop-target').forEach(function (l) { if (l !== lane) l.classList.remove('drop-target'); });
    lane.classList.add('drop-target');
  });
  document.addEventListener('drop', function (e) {
    var lane = e.target.closest && e.target.closest('.lane');
    if (!lane) return;
    e.preventDefault();
    lane.classList.remove('drop-target');
    var id = e.dataTransfer.getData('text/plain');
    if (id) moveByDrag(id, lane.dataset.lane);
  });

  // 書き込みの途中・未確定が残っている間にページを離れようとしたら確かめる
  window.addEventListener('beforeunload', function (e) {
    if (S.busy || Object.keys(S.unsettled).length) { e.preventDefault(); e.returnValue = ''; }
  });

  // ---- 起動 ----
  if (!C.GAS_URL && !MOCK) { showScreen('config'); return; }
  if (!MOCK) {
    var s = document.createElement('script');
    s.src = 'https://accounts.google.com/gsi/client';
    s.async = true;
    document.head.appendChild(s);
  } else {
    var m = document.createElement('script');
    m.src = 'ar-mock.js';
    m.onload = function () { window.dispatchEvent(new Event('DOMContentLoaded')); };
    document.head.appendChild(m);
  }
  showScreen('signin');
})();
</script>
</body>
</html>
