    </section>
    <p class="compare-note" id="compare-note" hidden></p>

    <div class="section-head">
      <div><h2>請求を確認する</h2><p>連絡状況とメモを、請求ごとに記録できます。<span id="drag-hint"></span></p></div>
      <div class="tabs" role="tablist" aria-label="請求の種類">
        <button class="tab" role="tab" type="button" data-tab="未入金" aria-selected="true">未入金 <b id="count-unpaid">0</b></button>
        <button class="tab" role="tab" type="button" data-tab="未設定" aria-selected="false">未設定 <b id="count-unset">0</b></button>

      <label class="search">取引先名・件名・請求番号・メモを検索<input class="control" id="search" type="search" placeholder="例：サンプル" autocomplete="off"></label>
      <label>並び順<select class="control" id="sort"><option value="age">経過日数の多い順</option><option value="age_asc">経過日数の少ない順</option><option value="amount">請求額の多い順</option><option value="client">取引先名順</option></select></label>
